3 °C, sec et lumineux — le Fuji se voit","loge":"Yanaka ou Nezu, le vieux Tokyo, bas et calme","nuitee":92,"signe":"tour","teinte":"aube","table":["Tsukiji le matin, debout : oursin, omelette dashi, thé grillé","Un izakaya de Yanaka, sans carte en anglais","Monjayaki, la version tokyoïte de l'okonomiyaki, qu'on cuit soi-même"],"resume":"Six nuits, dont trois journées entières hors de la ville."},{"id":"fukuoka","nom":"Fukuoka","kanji":"福岡","nuits":5,"j0":7,"j1":12,"meteo":"9–15 °C, doux pour la saison","loge":"Vers Nakasu ou Hakata, à dix minutes de la gare","nuitee":76,"signe":"torii","teinte":"jour","table":["Les <b>yatai</b> — cent trente baraques de rue montées chaque soir","Tonkotsu ramen, le bouillon d'os de porc, né ici","Mentaiko, œufs de morue au piment, sur du riz blanc"],"resume":"La base la moins chère, et la porte de la porcelaine."},{"id":"nagasaki","nom":"Nagasaki","kanji":"長崎","nuits":4,"j0":12,"j1":16,"meteo":"8–14 °C, la mer tempère","loge":"Sur les pentes, vers Glover ou Dejima","nuitee":78,"signe":"vague","teinte":"soir","table":["Champon — nouilles, porc, fruits de mer, bouillon laiteux","Castella, le gâteau portugais devenu japonais en quatre siècles","Shippoku : la table sino-portugaise, à partager"],"resume":"Une ville à flanc de baie, seule fenêtre du Japon fermé."},{"id":"kumamoto","nom":"Kumamoto","kanji":"熊本","nuits":3,"j0":16,"j1":19,"meteo":"8–15 °C en ville, 0–8 °C sur l'Aso","loge":"Dans le centre, près du tramway","nuitee":74,"signe":"volcan","teinte":"aube","table":["Basashi — le sashimi de cheval, spécialité locale","Karashi renkon, racine de lotus à la moutarde, frite","Le ramen de Kumamoto, à l'ail noir"],"resume":"Le plus grand cirque volcanique du monde, à une heure."}],"jours":[{"n":1,"etape":"tokyo","titre":"Arrivée","blocs":[{"h":"11h35","quoi":"Départ Paris CDG","note":"ANA, vol direct. Douze heures, sans escale — c'est ce qu'on achète avec ce billet.","cout":0,"kind":"move"},{"h":"07h05","quoi":"Atterrissage à Haneda","note":"Le lendemain matin, heure de Tokyo. Immigration et bagages : une heure. <b>Visit Japan Web</b> rempli dans l'avion fait gagner la file.","cout":0,"kind":"move"},{"h":"08h45","quoi":"Monorail puis Yamanote","note":"40 minutes jusqu'à Nippori. Prendre une carte Suica au distributeur de la gare : elle sert dans tous les transports et dans les supérettes.","cout":800,"kind":"move"},{"h":"10h00","quoi":"Déposer les valises","note":"Le check-in est à 15 h, mais tous les hôtels gardent les bagages. Ressortir tout de suite : c'est ce qui règle le décalage.","cout":0,"kind":"stay"},{"h":"11h00","quoi":"Yanaka, sans but","note":"Un des rares quartiers épargnés par le séisme de 1923 et par les bombardements de 1945. Ruelles basses, temples, un cimetière planté de cerisiers, et des chats.","cout":0,"kind":"walk"},{"h":"13h00","quoi":"Yanaka Ginza","note":"Une rue commerçante d'après-guerre, en pente, où l'on grignote debout : croquettes, brochettes, dorayaki tièdes.","cout":900,"kind":"eat"},{"h":"16h00","quoi":"Tenir jusqu'à 21 h","note":"Le décalage est de 8 h en hiver. Se coucher à 19 h coûte trois jours de réveils à 3 h du matin.","cout":0,"kind":"rest"},{"h":"18h30","quoi":"Premier izakaya","note":"Sans carte en anglais, avec des habitués. Montrer du doigt fonctionne très bien.","cout":3000,"kind":"eat"}],"note":"En février, la nuit tombe vers 17 h 30 et le jour se lève à 6 h 20. Les journées d'excursion partent tôt."},{"n":2,"etape":"tokyo","titre":"Le vieux Tokyo","blocs":[{"h":"06h30","quoi":"Tsukiji, le marché extérieur","note":"Le marché aux poissons a déménagé à Toyosu, mais les échoppes de rue sont restées. Oursin, omelette dashi, thé grillé, debout, au petit matin. C'est l'heure où le décalage vous réveille de toute façon.","cout":2000,"kind":"eat"},{"h":"09h00","quoi":"Hama-rikyu","note":"Un jardin de daimyo coincé entre les tours, avec un bassin qui monte et descend avec la marée — le seul du pays. En février, les pruniers y sont en fleurs et la maison de thé sur l'île sert le matcha.","cout":500,"kind":"walk"},{"h":"11h30","quoi":"Senso-ji et Nakamise","note":"Le plus vieux temple de Tokyo, et la rue d'échoppes qui y mène. En semaine et hors saison, c'est encore respirable.","cout":0,"kind":"see"},{"h":"14h00","quoi":"Kappabashi","note":"La rue des fournisseurs de restaurants, à dix minutes à pied. Couteaux forgés, moules à pâtisserie, vaisselle au kilo, répliques de plats en résine. <b>C'est là qu'on achète un couteau qui durera trente ans</b>, gravé à son nom devant soi. Y aller maintenant : on repassera le dernier jour si l'envie tient.","cout":0,"kind":"see"},{"h":"17h00","quoi":"Bain public de quartier","note":"Un sento de Yanaka, à 550 ¥. Ce n'est pas un onsen de luxe, c'est le bain du coin — et c'est exactement l'intérêt.","cout":550,"kind":"rest"}],"note":""},{"n":3,"etape":"tokyo","titre":"Nikko","blocs":[{"h":"07h30","quoi":"Tobu depuis Asakusa","note":"1 h 50 en limited express. Le Nikko All Area Pass couvre le train et les bus sur place.","cout":2900,"kind":"move"},{"h":"09h30","quoi":"Tosho-gu sous la neige","note":"Le mausolée de Tokugawa Ieyasu, qui croule sous les sculptures polychromes — <b>tout l'inverse de la sobriété japonaise</b>, et c'est le sujet. Les trois singes, le chat endormi. En hiver, la neige sur les toits de bronze et l'absence de cars valent le froid.","cout":1600,"kind":"see"},{"h":"11h30","quoi":"Bus vers le lac Chuzenji","note":"45 minutes par les vingt-huit lacets de l'Irohazaka. <b>Vérifier l'état de la route la veille</b> : elle ferme par forte neige, et les bus montent alors avec des chaînes.","cout":1250,"kind":"move"},{"h":"12h30","quoi":"Les chutes de Kegon","note":"97 m d'un seul jet, et un ascenseur qui descend cent mètres dans la roche jusqu'à une plateforme au pied. <b>En février, les embruns gèlent sur les parois</b> et les cascades secondaires du cirque se figent en colonnes de glace — c'est la meilleure saison pour les voir.","cout":570,"kind":"see"},{"h":"14h00","quoi":"Déjeuner au bord du lac","note":"Truite du lac, ou yuba — la peau de lait de soja dont Nikko a fait sa spécialité, servie brûlante.","cout":1500,"kind":"eat"},{"h":"15h30","quoi":"Redescente","note":"Le marais de Senjogahara est sous la neige : ses caillebotis ne se marchent qu'en raquettes de décembre à mars. On le laisse pour une autre saison.","cout":1250,"kind":"move"},{"h":"18h30","quoi":"Retour sur Tokyo","note":"","cout":2900,"kind":"move"}],"note":"Journée longue et froide : 0 à 6 °C au lac, plusieurs degrés de moins qu'à Tokyo. Prévoir gants et bonnet, et vérifier la météo la veille."},{"n":4,"etape":"tokyo","titre":"Kamakura","blocs":[{"h":"08h40","quoi":"Ligne JR Yokosuka","note":"55 minutes depuis Tokyo. L'ancienne capitale militaire du Japon, de 1185 à 1333, coincée entre les collines et la mer.","cout":950,"kind":"move"},{"h":"10h00","quoi":"Le Grand Bouddha","note":"Onze mètres de bronze, en plein air depuis qu'un raz-de-marée a emporté son pavillon en 1498. On entre à l'intérieur pour vingt yens.","cout":320,"kind":"see"},{"h":"11h00","quoi":"Hase-dera","note":"À dix minutes. Une Kannon de bois de neuf mètres, un jardin en terrasses qui descend vers la baie, et une grotte de divinités taillées dans la roche. En février, les pruniers du jardin sont en fleurs.","cout":400,"kind":"see"},{"h":"12h30","quoi":"Déjeuner","note":"Shirasu-don : les alevins de sardine de la baie, crus ou bouillis, sur du riz. On les pêche ici.","cout":1400,"kind":"eat"},{"h":"14h00","quoi":"Le sentier de Daibutsu","note":"Une heure et demie de crête boisée entre les temples, par les collines qui protégeaient la ville. Dénivelé modéré, racines et marches, et des vues sur la baie.","cout":0,"kind":"walk"},{"h":"16h00","quoi":"Hokoku-ji","note":"La bambouseraie, plus petite que celle d'Arashiyama et infiniment plus calme. On boit un matcha assis face aux bambous, compris dans l'entrée.","cout":900,"kind":"rest"},{"h":"18h00","quoi":"Retour","note":"","cout":950,"kind":"move"}],"note":""},{"n":5,"etape":"tokyo","titre":"Mont Takao","blocs":[{"h":"08h00","quoi":"Keio jusqu'à Takaosanguchi","note":"50 minutes depuis Shinjuku, pour 599 m de montagne — ce qui est absurde et formidable.","cout":430,"kind":"move"},{"h":"09h00","quoi":"Le sentier 6","note":"Il remonte un ruisseau en forêt et passe la petite chute de Biwa. 1 h 30, quelques passages dans le lit du cours d'eau. <b>En février, vérifier qu'il est ouvert</b> : il ferme parfois pour verglas, et le sentier 1, bitumé, prend le relais.","cout":0,"kind":"walk"},{"h":"10h45","quoi":"Yakuo-in","note":"À mi-pente, un temple de montagne aux statues de tengu — les créatures à long nez, gardiennes de la forêt.","cout":0,"kind":"see"},{"h":"11h45","quoi":"Le sommet, et le Fuji","note":"<b>L'hiver est la meilleure saison pour le voir</b> : l'air sec de février le rend net presque un jour sur deux, contre un sur cinq en été. Il est au sud-ouest, enneigé jusqu'à mi-hauteur.","cout":1000,"kind":"eat"},{"h":"13h30","quoi":"Funiculaire","note":"Un des plus raides du pays, et bienvenu à la descente.","cout":490,"kind":"move"},{"h":"14h30","quoi":"Les pruniers de la vallée","note":"Entre Takaosanguchi et Ume-no-sato, <b>dix mille pruniers</b> le long de la rivière et de la vieille route. Fin février, ils sont ouverts — c'est la première floraison de l'année, un mois avant les cerisiers, et personne ne se déplace pour elle.","cout":0,"kind":"walk"},{"h":"16h30","quoi":"Bain à Takaosan Onsen","note":"Contre la gare, à la sortie du sentier. Bains extérieurs, et on repart propre.","cout":1100,"kind":"rest"}],"note":"À faire en semaine : le Takao est la montagne du dimanche des Tokyoïtes."},{"n":6,"etape":"tokyo","titre":"Comment on vivait ici","blocs":[{"h":"09h00","quoi":"Musée en plein air de l'architecture Edo-Tokyo","note":"À Koganei, quarante minutes. Trente maisons et boutiques sauvées de la démolition et remontées : bains publics, taverne, échoppe de teinturier, villa moderniste de 1942. <b>C'est le meilleur endroit du voyage pour comprendre comment on vivait ici</b>, et presque personne n'y va.","cout":400,"kind":"see"},{"h":"12h30","quoi":"Déjeuner sur place","note":"La cantine du musée, dans une ancienne maison de thé.","cout":1000,"kind":"eat"},{"h":"14h30","quoi":"Nezu-jinja","note":"Retour vers Yanaka. Un sanctuaire de 1705 épargné par les bombes, avec un tunnel de petits torii rouges — celui de Fushimi Inari en miniature, sans la file.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Ce qu'on a repéré","note":"Fin d'après-midi libre : Kappabashi si le couteau a mûri, un dépachika de Ginza pour les premiers cadeaux, ou rien du tout.","cout":0,"kind":"rest"},{"h":"19h00","quoi":"Monjayaki","note":"La version tokyoïte de l'okonomiyaki : une pâte plus liquide qu'on cuit soi-même sur la plaque et qu'on racle avec de petites spatules. On en met partout, c'est prévu.","cout":2500,"kind":"eat"}],"note":""},{"n":7,"etape":"fukuoka","titre":"Le premier vol offert","blocs":[{"h":"08h30","quoi":"Vider la chambre","note":"","cout":0,"kind":"stay"},{"h":"09h30","quoi":"Monorail jusqu'à Haneda","note":"30 minutes depuis Hamamatsucho. Terminal intérieur, pas international.","cout":500,"kind":"move"},{"h":"11h30","quoi":"Vol Haneda → Fukuoka","note":"1 h 50. <b>Compris dans le billet international</b> — c'est tout l'intérêt de cette trame. Les règles bagages de l'international s'appliquent au segment intérieur.","cout":0,"kind":"move"},{"h":"13h20","quoi":"Arrivée à Fukuoka","note":"<b>Onze minutes de métro entre l'aéroport et la gare de Hakata</b> : Fukuoka a l'aéroport le mieux placé du pays.","cout":260,"kind":"move"},{"h":"14h30","quoi":"Kushida-jinja","note":"Le sanctuaire de la ville, où l'on garde toute l'année un char de festival de dix mètres — ceux que des équipes de quartier portent en courant chaque juillet.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Le parc Ohori","note":"Un ancien fossé de château devenu lac, avec des îlots reliés par des ponts. Deux kilomètres à plat, et c'est là que la ville se promène.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Premiers yatai","note":"Cent trente baraques montées chaque soir sur les trottoirs de Nakasu et Tenjin, démontées à l'aube. Huit tabourets, un rideau, du ramen et du oden. <b>Ça n'existe plus qu'ici.</b>","cout":2500,"kind":"eat"}],"note":"Deux heures de porte à porte contre cinq heures de Shinkansen — et le vol ne coûte rien. C'est ce que la promotion achète."},{"n":8,"etape":"fukuoka","titre":"Dazaifu","blocs":[{"h":"09h00","quoi":"Nishitetsu jusqu'à Dazaifu","note":"45 minutes depuis Tenjin. Certaines rames sont décorées par un designer de trains célèbre.","cout":420,"kind":"move"},{"h":"10h00","quoi":"Tenman-gu","note":"Le sanctuaire des études, où viennent les lycéens avant les examens. Six mille pruniers, et un bœuf de bronze qu'on frotte à la tête.","cout":0,"kind":"see"},{"h":"11h30","quoi":"Komyozen-ji","note":"À deux minutes, et presque personne : un jardin de mousse et de pierres qu'on regarde assis sur la véranda de bois. Deux cents yens dans une boîte.","cout":200,"kind":"rest"},{"h":"12h30","quoi":"Déjeuner","note":"Umegae-mochi, la galette de riz grillée fourrée de haricot rouge, vendue tout le long de l'allée.","cout":1200,"kind":"eat"},{"h":"14h00","quoi":"Musée national de Kyushu","note":"Un des quatre musées nationaux du pays, dans un bâtiment de verre courbe adossé à la colline. Il raconte le Japon par ses échanges avec le continent — ce qui est tout le sujet de cet itinéraire.","cout":700,"kind":"see"},{"h":"17h00","quoi":"Retour","note":"","cout":420,"kind":"move"}],"note":"Fin février, les six mille pruniers du sanctuaire sont en fleurs. C'est la raison de placer Dazaifu tôt dans l'étape : la floraison ne dure pas."},{"n":9,"etape":"fukuoka","titre":"Arita et Imari","blocs":[{"h":"08h20","quoi":"Limited express jusqu'à Arita","note":"1 h 20 vers l'ouest, à travers les collines de Saga.","cout":2800,"kind":"move"},{"h":"09h45","quoi":"Arita, la ville de la porcelaine","note":"<b>La première porcelaine du Japon y a été cuite en 1616</b>, par des potiers coréens amenés de force après les campagnes de Hideyoshi. La ville n'a jamais fait autre chose depuis.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le musée Kyushu Ceramic","note":"Quatre siècles de production, dont la collection Shibata — dix mille pièces d'Imari d'exportation. Gratuit.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Arita","note":"Servi dans de la porcelaine locale, forcément.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Le quartier des fours","note":"Uchiyama, une rue de kilns et d'ateliers, avec les murs de tessons — les rebuts de quatre siècles, encastrés dans les clôtures.","cout":0,"kind":"walk"},{"h":"15h30","quoi":"Peindre une pièce","note":"Plusieurs ateliers font décorer une tasse au pinceau, cuite ensuite et expédiée. Compter un mois pour la recevoir.","cout":2500,"kind":"see"},{"h":"17h00","quoi":"Retour sur Fukuoka","note":"","cout":2800,"kind":"move"}],"note":""},{"n":10,"etape":"fukuoka","titre":"Les barques de Yanagawa","blocs":[{"h":"09h00","quoi":"Nishitetsu jusqu'à Yanagawa","note":"50 minutes vers le sud.","cout":870,"kind":"move"},{"h":"10h15","quoi":"Descendre les canaux en barque","note":"Quatre cents ans de douves transformées en canaux, parcourus à la perche sur des barques à fond plat. Une heure au fil de l'eau, sous les saules et les ponts bas — le batelier chante, et il faut se baisser.","cout":1900,"kind":"walk"},{"h":"12h00","quoi":"Unagi no seiromushi","note":"L'anguille de Yanagawa, cuite à la vapeur sur son riz dans un panier laqué. C'est <b>le</b> plat de la ville, et il vaut le détour à lui seul.","cout":3500,"kind":"eat"},{"h":"14h00","quoi":"La résidence Ohana","note":"Une maison de daimyo avec son jardin de pins et sa salle occidentale de 1910, curieux mélange.","cout":700,"kind":"see"},{"h":"16h30","quoi":"Retour sur Fukuoka","note":"","cout":870,"kind":"move"}],"note":"Les <b>sagemon</b> — des mobiles de poupées et d'ornements cousus, suspendus dans les maisons de marchands — s'exposent de mi-février à début avril pour le Hinamatsuri. À confirmer sur le site de la ville, les dates bougent d'une année sur l'autre."},{"n":11,"etape":"fukuoka","titre":"La ville, sans rien forcer","blocs":[{"h":"09h30","quoi":"Le musée d'Asie de Fukuoka","note":"Le seul musée au monde consacré à l'art contemporain de toute l'Asie. Petit, très bien fait.","cout":200,"kind":"see"},{"h":"11h30","quoi":"Shofuku-ji","note":"<b>Le premier temple zen du Japon</b>, fondé en 1195 par le moine qui a rapporté le thé de Chine. On y entre librement, il n'y a rien à payer et presque personne.","cout":0,"kind":"see"},{"h":"13h00","quoi":"Ramen au comptoir","note":"Le tonkotsu est né ici : un bouillon d'os de porc bouilli douze heures jusqu'à devenir blanc. On commande la fermeté des nouilles, et on peut redemander une portion sèche — <i>kaedama</i>.","cout":900,"kind":"eat"},{"h":"15h00","quoi":"Faire ses courses à Tenjin","note":"Les grands magasins, les sous-sols alimentaires, et les rues couvertes autour de Daimyo pour les petites boutiques.","cout":0,"kind":"see"},{"h":"18h30","quoi":"Dernier yatai","note":"Choisir une baraque avec des habitués plutôt qu'une carte en anglais.","cout":2500,"kind":"eat"}],"note":""},{"n":12,"etape":"nagasaki","titre":"La fenêtre du Japon fermé","blocs":[{"h":"09h30","quoi":"Kamome et Shinkansen Nishi-Kyushu","note":"1 h 30 avec un changement à Takeo-Onsen. La ligne à grande vitesse est ouverte depuis 2022 et ne va nulle part ailleurs.","cout":6600,"kind":"move"},{"h":"11h10","quoi":"Arrivée, dépose des valises","note":"La ville tient dans une baie étroite : tout se fait à pied ou en tramway, à 140 ¥ le trajet.","cout":0,"kind":"stay"},{"h":"13h30","quoi":"Dejima","note":"<b>Pendant deux cent dix ans, cet îlot en éventail a été le seul point de contact entre le Japon et l'Occident.</b> Les Hollandais y étaient consignés, et tout ce qui est entré de science européenne est passé par là. Une quinzaine de bâtiments ont été reconstruits à l'identique.","cout":520,"kind":"see"},{"h":"16h00","quoi":"Le quartier chinois et le pont aux lunettes","note":"Shinchi, un des trois quartiers chinois du Japon. Le Megane-bashi, de 1634, se reflète en deux cercles quand la rivière est calme.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Champon","note":"Nouilles épaisses, porc, fruits de mer et légumes dans un bouillon blanc — inventé ici pour nourrir les étudiants chinois pauvres.","cout":1200,"kind":"eat"}],"note":""},{"n":13,"etape":"nagasaki","titre":"Ce qui s'est passé ici","blocs":[{"h":"09h00","quoi":"Musée de la bombe atomique","note":"Le 9 août 1945 à 11 h 02. Le musée est chronologique, factuel et très dur — surtout la salle des objets. Prévoir de ne rien faire de lourd après.","cout":200,"kind":"see"},{"h":"11h00","quoi":"L'hypocentre et le parc de la Paix","note":"Une colonne noire marque le point exact, à cinq cents mètres au-dessus duquel la bombe a explosé. Autour, les pans de la cathédrale Urakami laissés en place.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner tranquille","note":"","cout":1200,"kind":"eat"},{"h":"14h30","quoi":"Le sanctuaire au torii d'une jambe","note":"Sanno-jinja : le souffle en a emporté la moitié, et il tient debout ainsi depuis. À côté, deux camphriers calcinés qui ont refeuillé l'année suivante.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Une fin d'après-midi vide","note":"Volontairement. Un café, la chambre, la baie.","cout":0,"kind":"rest"}],"note":"La journée la plus lourde du voyage. Elle est placée en début d'étape pour ne pas finir dessus."},{"n":14,"etape":"nagasaki","titre":"Gunkanjima","blocs":[{"h":"09h00","quoi":"Bateau pour Hashima","note":"Une île de deux cents mètres sur quatre cents, couverte d'immeubles de béton vides — <b>la plus forte densité humaine jamais atteinte</b> quand cinq mille mineurs y vivaient. Fermée en 1974, abandonnée telle quelle.","cout":4500,"kind":"move"},{"h":"10h30","quoi":"Débarquement","note":"On ne visite qu'un couloir sécurisé au sud, le reste s'écroule. La sortie est annulée si la houle dépasse 50 cm — <b>compter un jour de repli</b>.","cout":310,"kind":"see"},{"h":"13h00","quoi":"Déjeuner au retour","note":"Sur le port.","cout":1500,"kind":"eat"},{"h":"15h00","quoi":"Glover Garden","note":"Les maisons des marchands occidentaux du XIXᵉ, sur la pente, avec vue sur la baie. Celle de Glover est la plus ancienne maison de style occidental du Japon.","cout":620,"kind":"see"},{"h":"17h00","quoi":"Oura, et les chrétiens cachés","note":"La plus ancienne église du pays. En 1865, des paysans y ont avoué à un prêtre français que leurs familles pratiquaient en secret depuis <b>sept générations</b>, sans prêtre ni livre.","cout":1000,"kind":"see"},{"h":"20h00","quoi":"Le mont Inasa","note":"Téléphérique jusqu'à 333 m. La baie en fer à cheval, illuminée — une des vues de nuit les plus réputées du pays.","cout":1250,"kind":"see"}],"note":""},{"n":15,"etape":"nagasaki","titre":"Unzen, ou la ville","blocs":[{"h":"08h30","quoi":"Bus pour Unzen","note":"1 h 40 par la péninsule de Shimabara.","cout":1850,"kind":"move"},{"h":"10h30","quoi":"Les Enfers d'Unzen","note":"Des fumerolles en plein village, avec des passerelles entre les évents. C'est là qu'on a exécuté des chrétiens en les ébouillantant au XVIIᵉ — le lieu porte les deux histoires.","cout":0,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner et bain","note":"Les auberges du village ouvrent leurs bains à la journée.","cout":2200,"kind":"rest"},{"h":"15h00","quoi":"Retour sur Nagasaki","note":"","cout":1850,"kind":"move"},{"h":"18h00","quoi":"Shippoku, si l'envie est là","note":"La table sino-portugaise de Nagasaki, servie à partager sur un plateau rond — ce qui, au Japon, ne se fait nulle part ailleurs. Se réserve à trois minimum, donc c'est jouable.","cout":5000,"kind":"eat"}],"note":"Variante si la sortie à Gunkanjima a été annulée la veille : c'est le jour de repli."},{"n":16,"etape":"kumamoto","titre":"Le château qui se relève","blocs":[{"h":"10h00","quoi":"Shinkansen via Fukuoka","note":"1 h 55 avec un changement à Hakata.","cout":9100,"kind":"move"},{"h":"12h30","quoi":"Arrivée, dépose","note":"Le tramway dessert tout depuis la gare.","cout":0,"kind":"stay"},{"h":"14h00","quoi":"Le château","note":"Un des trois grands châteaux du Japon, et ses murs incurvés que l'on disait infranchissables. <b>Le séisme de 2016 en a jeté une partie à terre</b> ; la reconstruction pierre par pierre durera jusqu'en 2052. Une passerelle surélevée traverse le chantier — on voit les murs en cours de remontage, numérotés.","cout":800,"kind":"see"},{"h":"16h30","quoi":"Le jardin Suizenji","note":"Un parcours du Tokaido miniature : chaque butte est une étape de la route, dont un mont Fuji en gazon. Dessiné au XVIIᵉ autour d'une source.","cout":400,"kind":"walk"},{"h":"19h00","quoi":"Karashi renkon","note":"Racine de lotus fourrée à la moutarde puis frite. Et le basashi pour qui veut essayer — Kumamoto en est la capitale.","cout":3000,"kind":"eat"}],"note":""},{"n":17,"etape":"kumamoto","titre":"L'Aso","blocs":[{"h":"08h00","quoi":"Train pour Aso","note":"1 h 20 par la ligne de Hohi, qui monte dans la caldeira.","cout":1130,"kind":"move"},{"h":"09h30","quoi":"Entrer dans le cirque","note":"<b>Le plus grand cirque volcanique du monde</b> : 25 km sur 18, avec quarante mille personnes qui vivent dedans, des villages, des routes et des rizières. Le rebord se voit de partout.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le Nakadake","note":"Le cratère actif, fumant, qu'on approche en car jusqu'au bord. <b>L'accès ferme sans préavis</b> selon les gaz — vérifier le matin même sur le site du parc.","cout":1200,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Kusasenri","note":"La prairie d'altitude, avec des chevaux en liberté et un ancien cratère devenu étang.","cout":1400,"kind":"eat"},{"h":"14h00","quoi":"Le Komezuka","note":"Une colline conique parfaite, un cône de scories de cent mètres, avec une entaille au sommet — la légende dit qu'un dieu y a puisé du riz pour les affamés.","cout":0,"kind":"walk"},{"h":"16h00","quoi":"Retour","note":"","cout":1130,"kind":"move"}],"note":"En mars, la caldeira est verte et le sommet parfois blanc. <b>La route du cratère ferme sans préavis</b> selon les gaz, et par neige : vérifier le matin même sur le site du parc national."},{"n":18,"etape":"kumamoto","titre":"Kurokawa","blocs":[{"h":"09h00","quoi":"Bus pour Kurokawa Onsen","note":"2 h 30 à travers l'Aso. Un village thermal qui a refusé les néons et les grands hôtels : bois, pierre, lanternes, et une rivière au milieu.","cout":3000,"kind":"move"},{"h":"12h00","quoi":"Le passeport des bains","note":"Un jeton de bois donne accès à <b>trois bains extérieurs au choix</b> parmi vingt-quatre, répartis dans les auberges du village. On circule en yukata d'un bain à l'autre.","cout":1500,"kind":"rest"},{"h":"13h30","quoi":"Déjeuner au village","note":"","cout":1800,"kind":"eat"},{"h":"17h00","quoi":"Retour à Kumamoto","note":"","cout":3000,"kind":"move"},{"h":"19h30","quoi":"Dernier dîner","note":"","cout":4000,"kind":"eat"}],"note":"De décembre à mars, le village allume chaque soir les <b>yuakari</b> : des lanternes de bambou tressé posées le long de la rivière. C'est la saison où Kurokawa est le plus beau — et la plus froide, donc la meilleure pour les bains extérieurs. Dates à confirmer auprès du syndicat d'initiative."},{"n":19,"etape":"kumamoto","titre":"Retour par le second vol offert","blocs":[{"h":"07h00","quoi":"Petit déjeuner et valises","note":"Prévoir large à la pesée : Kappabashi, Arita et les dépachika laissent des traces.","cout":0,"kind":"stay"},{"h":"08h30","quoi":"Aéroport de Kumamoto","note":"50 minutes de bus depuis le centre.","cout":1000,"kind":"move"},{"h":"10h20","quoi":"Vol Kumamoto → Haneda","note":"1 h 50, <b>compris dans le billet</b>. Même réservation que l'international : en cas de retard, ANA réachemine — c'est l'avantage du billet unique sur deux billets séparés.","cout":0,"kind":"move"},{"h":"12h10","quoi":"Correspondance à Haneda","note":"Passage du terminal intérieur à l'international par navette, quinze minutes. Compter trois heures entre les deux vols.","cout":0,"kind":"move"},{"h":"15h05","quoi":"Vol Haneda → Paris CDG","note":"Douze heures, direct. Départ en début d'après-midi, arrivée à Paris en fin d'après-midi le même jour.","cout":0,"kind":"move"}],"note":"Le voyage doit être terminé avant le 15 mars 2027 : ce retour est le dernier utilisable."}],"resa":[{"quoi":"Le billet ANA avec la promotion TOKYO+","quand":"<b>avant le 30 septembre 2026</b>","note":"La mise en vente ne dure qu'un mois. <b>Vérifier sur le tunnel la franchise bagages pour trois passagers</b> — le tableau officiel du passage de 2 à 1 pièce ne couvre que les départs du Japon, pas de Paris — et la durée de séjour maximale du tarif.","critique":true},{"quoi":"Les deux vols intérieurs","quand":"à la réservation du billet","note":"Haneda → Fukuoka et Kumamoto → Haneda, à demander <b>dans la même réservation</b>. <b>Les deux aéroports intérieurs peuvent différer</b> — c'est l'itinéraire B donné en exemple par ANA : Tokyo → Fukuoka à l'aller, Hiroshima → Tokyo au retour, le trajet terrestre entre les deux restant à la charge du voyageur. Réserver via « <b>Rechercher plusieurs villes</b> », en saisissant les segments dans l'ordre et en terminant par le vol retour.","critique":true},{"quoi":"La sortie à Gunkanjima","quand":"2 mois avant","note":"Deux compagnies, sièges limités. <b>Annulée si la houle dépasse 50 cm</b>, et l'hiver est la saison la plus agitée — garder le jour 15 en repli.","critique":true},{"quoi":"L'option second bagage, sur le retour","quand":"à la réservation, ou plus tard","note":"ANA n'inclut plus qu'<b>une pièce de 23 kg</b> au départ de Paris — vérifié sur un vol effectué en 2025. La seconde coûte un peu plus de 100 € <b>par trajet et par personne</b> : ne la prendre que sur le retour.","critique":false},{"quoi":"Les hôtels","quand":"3 mois avant","note":"Quatre réservations seulement. La chambre à trois reste ce qui limite le choix, à Tokyo surtout.","critique":false},{"quoi":"L'atelier de porcelaine à Arita","quand":"3 semaines avant","note":"La pièce est cuite après votre départ et expédiée : compter un mois.","critique":false},{"quoi":"Le shippoku de Nagasaki","quand":"2 semaines avant","note":"Se commande à l'avance, et pour trois personnes minimum — ce qui tombe bien.","critique":false},{"quoi":"Le Nikko All Area Pass","quand":"la veille","note":"Couvre le train Tobu et les bus du lac. Se prend au guichet d'Asakusa.","critique":false},{"quoi":"L'état de la route de l'Irohazaka et du cratère de l'Aso","quand":"le matin même","note":"Les deux ferment sans préavis, l'une par neige, l'autre par les gaz.","critique":false}],"budget":[["Vol A/R","ANA direct CDG–Haneda, <b>deux vols intérieurs compris</b>. 1 × 23 kg inclus",893],["Second bagage","Option retour seulement, par personne — ANA n'inclut plus qu'une pièce",105],["Hébergement","18 nuits en chambre à trois, aucune nuit de montagne",489],["Transport","95 € entre les étapes, 164 € d'excursions, 7 €/jour de local",392],["Nourriture","40 € par jour et par personne",760],["Activités","Entrées, Gunkanjima, atelier de porcelaine",145],["Divers","eSIM, assurance, souvenirs",200]]},{"id":"sud-nord","titre":"Tokyo, Kyushu,<br>et <em>Tokyo</em>","court":"Tokyo, Kyushu, Tokyo — en solo","resume":"Six étapes, du sud volcanique au nord de l'île, sans jamais refaire un trajet.","deck":"En solo, sur la promotion ANA : trois nuits à Tokyo en arrivant, Kyushu du sud au nord — Kagoshima et son volcan en activité, l'Aso, Kurokawa, Nagasaki — puis Hakone, ses bains et le Fuji en face. Les deux vols offerts font les deux sauts, et aucun trajet n'est fait deux fois.","nuits":23,"trajet":"7 h 05","par_pers":3828,"vols":true,"solo":true,"depart":"2027-02-15","etapes":[{"id":"tokyo","nom":"Tokyo","kanji":"東京","nuits":3,"j0":1,"j1":4,"meteo":"6–13 °C, sec et lumineux — le Fuji se voit","loge":"Guesthouse à Yanaka ou Kuramae","nuitee":45,"signe":"tour","teinte":"aube","table":["Tsukiji le matin, debout : oursin, omelette dashi, thé grillé","Un izakaya de comptoir, seul, où l'on parle à son voisin","Monjayaki, qu'on cuit soi-même sur la plaque"],"resume":"Trois nuits pour poser le décalage, sur ce que Tokyo garde de moins évident."},{"id":"kagoshima","nom":"Kagoshima","kanji":"鹿児島","nuits":3,"j0":4,"j1":7,"meteo":"9–16 °C, la ville la plus douce du pays","loge":"Guesthouse vers Tenmonkan, le quartier des arcades","nuitee":30,"signe":"volcan","teinte":"soir","table":["Kurobuta — le porc noir de Kagoshima, en shabu-shabu ou pané","Satsuma-age, beignets de poisson frits, debout au marché","Shochu de patate douce, coupé d'eau chaude"],"resume":"Un volcan en activité en face de la ville, et le sud que personne ne fait."},{"id":"kumamoto","nom":"Kumamoto","kanji":"熊本","nuits":4,"j0":7,"j1":11,"meteo":"7–15 °C en ville, 0–8 °C sur l'Aso","loge":"Centre-ville, plus une nuit de ryokan à Kurokawa","nuitee":32,"signe":"cascade","teinte":"aube","table":["Basashi — le sashimi de cheval, dont Kumamoto est la capitale","Karashi renkon, racine de lotus à la moutarde, frite","Le dîner du ryokan de Kurokawa, servi en chambre"],"resume":"Le plus grand cirque volcanique du monde, et deux jours sans rien courir."},{"id":"nagasaki","nom":"Nagasaki","kanji":"長崎","nuits":4,"j0":11,"j1":15,"meteo":"8–14 °C, la mer tempère","loge":"Sur les pentes, vers Glover ou Dejima","nuitee":34,"signe":"vague","teinte":"soir","table":["Champon — nouilles, porc, fruits de mer, bouillon laiteux","Castella, le gâteau portugais devenu japonais en quatre siècles","Toruko rice : riz pilaf, spaghettis et escalope dans la même assiette"],"resume":"Une ville à flanc de baie, seule fenêtre du Japon fermé."},{"id":"fukuoka","nom":"Fukuoka","kanji":"福岡","nuits":3,"j0":15,"j1":18,"meteo":"9–15 °C, doux","loge":"Vers Hakata, à onze minutes de l'aéroport","nuitee":34,"signe":"torii","teinte":"jour","table":["Les <b>yatai</b> — cent trente baraques de rue montées chaque soir","Tonkotsu ramen, le bouillon d'os de porc, né ici","Mentaiko, œufs de morue au piment, sur du riz blanc"],"resume":"Trois nuits : la porcelaine, les pruniers, et les baraques de rue."},{"id":"hakone","nom":"Hakone","kanji":"箱根","nuits":3,"j0":18,"j1":21,"meteo":"3–11 °C, et <b>le Fuji dégagé un jour sur deux</b> en février","loge":"Une auberge à Hakone-Yumoto, puis un ryokan avec bain privatif","nuitee":90,"signe":"volcan","teinte":"aube","table":["Les <b>kuro-tamago</b> d'Owakudani, œufs noircis dans l'eau sulfureuse","Le tofu de Hakone, monté à l'eau de source","Un kaiseki de ryokan servi en chambre, le dernier vrai repas du voyage"],"resume":"Trois nuits de bains et de volcan, avec le Fuji en face — et rien à courir."},{"id":"tokyo-fin","nom":"Tokyo, pour finir","kanji":"東京","nuits":3,"j0":21,"j1":24,"meteo":"8–15 °C, la ville s'ouvre au printemps","loge":"Sur la Yamanote, à portée de Kappabashi et de Ginza","nuitee":45,"signe":"pagode","teinte":"soir","table":["Les dépachika de Ginza pour les cadeaux","Un dernier izakaya, sans carte en anglais"],"resume":"Trois nuits pour les achats, une flânerie, et un vol du matin sans stress."}],"jours":[{"n":1,"etape":"tokyo","titre":"Arrivée, le soir","blocs":[{"h":"18h40","quoi":"Départ Paris CDG","note":"<b>NH216</b>, direct, 13 h 30 de vol. On décolle le soir et on dort dans l'avion.","cout":0,"kind":"move"},{"h":"16h10","quoi":"Atterrissage à Haneda","note":"Le lendemain, en fin d'après-midi. <b>Visit Japan Web</b> rempli dans l'avion fait gagner la file ; immigration et bagages prennent tout de même une heure.","cout":0,"kind":"move"},{"h":"17h30","quoi":"Monorail puis Yamanote","note":"40 minutes jusqu'à Nippori. Prendre une carte Suica au distributeur : elle sert dans tous les transports et dans les supérettes.","cout":800,"kind":"move"},{"h":"18h45","quoi":"Poser le sac","note":"La guesthouse est à dix minutes de la gare. Douche, et ressortir aussitôt.","cout":0,"kind":"stay"},{"h":"19h30","quoi":"Premier repas, tout près","note":"Ne rien viser haut ce soir : un ramen ou l'izakaya de la rue d'à côté, et une supérette pour l'eau et le petit déjeuner.","cout":2000,"kind":"eat"},{"h":"22h00","quoi":"Se coucher","note":"Il est 14 h à Paris. Vous vous réveillerez vers 4 h du matin. Tant mieux : les deux premières journées commencent tôt.","cout":0,"kind":"rest"}],"note":"<b>NH216 se pose à 16 h 10</b> : le premier jour n'est qu'une soirée. La première vraie journée est le J2, et le décalage la fait commencer à Tsukiji avant l'aube — ce qui tombe bien."},{"n":2,"etape":"tokyo","titre":"Avant l'aube","blocs":[{"h":"06h00","quoi":"Senso-ji, vide","note":"Le plus vieux temple de Tokyo est ouvert en permanence. À six heures la grande lanterne est éclairée, Nakamise a ses rideaux baissés, et il n'y a personne — c'est le seul créneau où l'endroit tient ses promesses. Le décalage vous réveille à 4 h de toute façon.","cout":0,"kind":"see"},{"h":"07h30","quoi":"Un kissaten d'Asakusa","note":"Les cafés à l'ancienne ouvrent à 7 h : toast épais coupé en deux, œuf dur, café filtre servi au siphon. Un petit déjeuner japonais qui n'a rien de japonais, et des habitués qui lisent le journal.","cout":900,"kind":"eat"},{"h":"09h00","quoi":"Hama-rikyu","note":"Un jardin de daimyo coincé entre les tours, avec <b>un bassin qui monte et descend avec la marée</b> — le seul du pays. En février les pruniers y sont en fleurs, et la maison de thé sur l'île sert le matcha face à l'eau.","cout":500,"kind":"walk"},{"h":"11h00","quoi":"Le bateau sur la Sumida","note":"Quarante minutes de Hama-rikyu à Asakusa, sous douze ponts tous différents. C'est la façon dont on circulait dans Edo, et la ville se lit autrement depuis l'eau.","cout":1200,"kind":"move"},{"h":"13h00","quoi":"Déjeuner","note":"Au hasard d'une rue latérale, loin de Nakamise.","cout":1400,"kind":"eat"},{"h":"15h00","quoi":"Kagurazaka","note":"Une colline de ruelles pavées, d'anciennes maisons de geishas et d'escaliers étroits, devenue le quartier français de Tokyo — on y trouve des boulangeries et des enseignes en français au milieu des ryotei. Le contraste vaut la montée.","cout":0,"kind":"walk"},{"h":"17h30","quoi":"Un sento","note":"Le bain public du quartier, à 550 ¥. Ce n'est pas un onsen de luxe, c'est le bain du coin — et c'est exactement l'intérêt.","cout":550,"kind":"rest"},{"h":"19h30","quoi":"Izakaya","note":"Sans carte en anglais, avec des habitués.","cout":3000,"kind":"eat"}],"note":"<b>Tsukiji ne figure pas dans la trame</b> : depuis le départ des grossistes pour Toyosu en 2018, le marché extérieur est devenu une rue à touristes. Senso-ji à six heures rend bien mieux le même service — se lever tôt et voir la ville avant qu'elle s'ouvre."},{"n":3,"etape":"tokyo","titre":"Comment on vivait ici","blocs":[{"h":"09h00","quoi":"Musée en plein air de l'architecture Edo-Tokyo","note":"À Koganei, quarante minutes. Trente maisons et boutiques sauvées de la démolition et remontées : bains publics, taverne, échoppe de teinturier, villa moderniste de 1942. <b>C'est le meilleur endroit du voyage pour comprendre comment on vivait ici</b>, et presque personne n'y va.","cout":400,"kind":"see"},{"h":"12h30","quoi":"Déjeuner sur place","note":"La cantine du musée, dans une ancienne maison de thé.","cout":1000,"kind":"eat"},{"h":"14h30","quoi":"Nezu-jinja","note":"Retour vers Yanaka. Un sanctuaire de 1705 épargné par les bombes, avec un tunnel de petits torii rouges — celui de Fushimi Inari en miniature, sans la file.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Ce qu'on a repéré","note":"Fin d'après-midi libre : Kappabashi si le couteau a mûri, un dépachika de Ginza pour les premiers cadeaux, ou rien du tout.","cout":0,"kind":"rest"},{"h":"19h00","quoi":"Monjayaki","note":"La version tokyoïte de l'okonomiyaki : une pâte plus liquide qu'on cuit soi-même sur la plaque et qu'on racle avec de petites spatules. On en met partout, c'est prévu.","cout":2500,"kind":"eat"}],"note":""},{"n":4,"etape":"kagoshima","titre":"Tokyo le matin, le volcan le soir","blocs":[{"h":"06h30","quoi":"Yanaka au petit jour","note":"Le cimetière et ses ruelles avant que le quartier s'éveille : c'est à cinq minutes de la guesthouse, c'est gratuit, et le décalage vous a réveillé de toute façon. Les chats sont déjà debout.","cout":0,"kind":"walk"},{"h":"08h00","quoi":"Petit déjeuner à Yanaka Ginza","note":"Les échoppes de la rue en pente ouvrent tôt : croquettes, brochettes, dorayaki tièdes, mangés debout.","cout":800,"kind":"eat"},{"h":"09h00","quoi":"Nezu-jinja","note":"Un sanctuaire de 1705 épargné par les bombes, avec <b>un tunnel de petits torii vermillon</b> — celui de Fushimi Inari en miniature, à dix minutes à pied, et sans la file.","cout":0,"kind":"see"},{"h":"11h15","quoi":"Récupérer le sac, monorail","note":"30 minutes depuis Hamamatsucho. Terminal intérieur, pas international.","cout":500,"kind":"move"},{"h":"13h10","quoi":"Vol Haneda → Kagoshima","note":"<b>NH2475</b>, 2 h, <b>compris dans le billet international</b>. Dix vols par jour sur cette ligne, de 6 h 35 à 19 h 05 : celui-ci laisse une vraie matinée à Tokyo. Même réservation que l'international, donc ANA réachemine en cas de retard.","cout":0,"kind":"move"},{"h":"15h50","quoi":"Bus jusqu'au centre","note":"40 minutes depuis l'aéroport, puis le tram.","cout":1400,"kind":"move"},{"h":"17h15","quoi":"Le Sakurajima, depuis la ville","note":"Il est à quatre kilomètres, en face, de l'autre côté de la baie. <b>Il crache presque tous les jours.</b> Les habitants gardent des parapluies contre la cendre et les écoles ont des casques. On s'assoit sur le front de mer et on regarde.","cout":0,"kind":"see"},{"h":"19h30","quoi":"Tenmonkan","note":"Le quartier des arcades couvertes. Kurobuta, le porc noir, en tonkatsu.","cout":2000,"kind":"eat"}],"note":"Journée à cheval : Tokyo le matin, Kyushu le soir. En février le soleil se couche vers 18 h — vous serez sur le front de mer à temps."},{"n":5,"etape":"kagoshima","titre":"Le volcan","blocs":[{"h":"08h00","quoi":"Ferry pour Sakurajima","note":"15 minutes, toutes les quinze minutes, 24 h sur 24. On paie en descendant.","cout":200,"kind":"move"},{"h":"08h30","quoi":"Le bain de pieds du visitor centre","note":"Cent mètres de long, alimenté par la source volcanique, face à la baie. Gratuit.","cout":0,"kind":"rest"},{"h":"09h30","quoi":"Le tour de l'île en bus","note":"Le bus Island View fait le circuit des belvédères. <b>Le cratère est interdit d'approche à moins de deux kilomètres</b> — on regarde depuis Yunohira, le point le plus haut autorisé.","cout":500,"kind":"see"},{"h":"11h30","quoi":"Le torii enterré de Kurokami","note":"L'éruption de 1914 a englouti le village sous trois mètres de cendre et soudé l'île à la péninsule. Du torii du sanctuaire, il ne dépasse que le linteau — on l'a laissé tel quel.","cout":0,"kind":"see"},{"h":"13h00","quoi":"Déjeuner sur l'île","note":"Les daikons de Sakurajima pèsent jusqu'à trente kilos, les mandarines font deux centimètres. Le sol volcanique fait des choses étranges.","cout":1200,"kind":"eat"},{"h":"15h00","quoi":"Sengan-en","note":"De retour sur la rive, le jardin de la famille Shimazu, qui emprunte le volcan comme décor de fond — le <i>shakkei</i> le plus spectaculaire du Japon. À côté, la première usine industrielle du pays, de 1865.","cout":1600,"kind":"see"},{"h":"18h30","quoi":"Shochu","note":"Kagoshima en produit plus que toute autre région. Celui de patate douce se boit coupé d'eau chaude : l'eau d'abord, l'alcool ensuite.","cout":1500,"kind":"eat"}],"note":""},{"n":6,"etape":"kagoshima","titre":"Le sable brûlant","blocs":[{"h":"09h20","quoi":"Train pour Ibusuki","note":"1 h 20 le long de la côte, sur la ligne Ibusuki-Makurazaki. Le Fuji de Satsuma — le Kaimondake, un cône parfait — apparaît à droite : c'est la moitié du plaisir de la journée.","cout":1020,"kind":"move"},{"h":"11h00","quoi":"Le bain de sable","note":"On enfile un yukata, on s'allonge sur la plage, et <b>on vous enterre sous le sable chauffé par la source</b>, tête découverte. Dix minutes suffisent : le poids et la chaleur font transpirer comme rien d'autre. On se rince aux bains ensuite.","cout":1100,"kind":"rest"},{"h":"13h00","quoi":"Déjeuner","note":"Les nouilles somen qui tournent dans un bassin d'eau de source, à Tosenkyo — on les attrape au passage.","cout":1300,"kind":"eat"},{"h":"15h00","quoi":"Le lac Ikeda, ou rien","note":"Un cratère rempli d'eau à vingt minutes, avec le Kaimondake derrière. Ou bien on reste sur la plage : la journée est courte exprès.","cout":0,"kind":"rest"},{"h":"17h30","quoi":"Retour sur Kagoshima","note":"","cout":1020,"kind":"move"}],"note":"Journée volontairement légère : trois heures de train aller-retour, et rien d'autre à courir. Option pour qui veut plus : <b>Chiran</b> et ses sept jardins de samouraïs, avec le musée des lettres de pilotes kamikazes — 2 h 30 de car dans la journée. Ou le <b>Kirishima</b> et le Karakuni-dake, 1 700 m, trois heures de marche, mais 3 h 20 de car."},{"n":7,"etape":"kumamoto","titre":"Remonter d'un cran","blocs":[{"h":"09h00","quoi":"Shinkansen Sakura jusqu'à Kumamoto","note":"50 minutes. Le seul long trajet du voyage qui ne soit pas un vol offert.","cout":6000,"kind":"move"},{"h":"10h30","quoi":"Déposer le sac","note":"","cout":0,"kind":"stay"},{"h":"11h30","quoi":"Le château","note":"Un des trois grands châteaux du pays, et ses murs incurvés qu'on disait infranchissables. <b>Le séisme de 2016 en a jeté une partie à terre</b> ; la reconstruction pierre par pierre durera jusqu'en 2052. Une passerelle traverse le chantier — on voit les murs en cours de remontage, chaque pierre numérotée.","cout":800,"kind":"see"},{"h":"14h30","quoi":"Le jardin Suizenji","note":"Un parcours du Tokaido en miniature : chaque butte est une étape de la route, dont un mont Fuji en gazon. Dessiné au XVIIᵉ autour d'une source.","cout":400,"kind":"walk"},{"h":"18h30","quoi":"Karashi renkon","note":"Racine de lotus fourrée à la moutarde puis frite. Et le basashi pour qui veut essayer.","cout":2500,"kind":"eat"}],"note":""},{"n":8,"etape":"kumamoto","titre":"L'Aso","blocs":[{"h":"08h00","quoi":"Train pour Aso","note":"1 h 20 par la ligne de Hohi, qui monte dans la caldeira.","cout":1130,"kind":"move"},{"h":"09h30","quoi":"Entrer dans le cirque","note":"<b>Le plus grand cirque volcanique du monde</b> : 25 km sur 18, avec quarante mille personnes qui vivent dedans, des villages, des routes et des rizières. Le rebord se voit de partout.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le Nakadake","note":"Le cratère actif, fumant, qu'on approche en car jusqu'au bord. <b>L'accès ferme sans préavis</b> selon les gaz — vérifier le matin même sur le site du parc.","cout":1200,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Kusasenri","note":"La prairie d'altitude, avec des chevaux en liberté et un ancien cratère devenu étang.","cout":1400,"kind":"eat"},{"h":"14h00","quoi":"Le Komezuka","note":"Une colline conique parfaite, un cône de scories de cent mètres, avec une entaille au sommet — la légende dit qu'un dieu y a puisé du riz pour les affamés.","cout":0,"kind":"walk"},{"h":"16h00","quoi":"Retour","note":"","cout":1130,"kind":"move"}],"note":"En mars, la caldeira est verte et le sommet parfois blanc. <b>La route du cratère ferme sans préavis</b> selon les gaz, et par neige : vérifier le matin même sur le site du parc national."},{"n":9,"etape":"kumamoto","titre":"Kurokawa","blocs":[{"h":"09h00","quoi":"Bus pour Kurokawa Onsen","note":"2 h 30 à travers l'Aso. Un village thermal qui a refusé les néons et les grands hôtels : bois, pierre, lanternes, et une rivière au milieu.","cout":3000,"kind":"move"},{"h":"12h00","quoi":"Le passeport des bains","note":"Un jeton de bois donne accès à <b>trois bains extérieurs au choix</b> parmi vingt-quatre, répartis dans les auberges. On circule en yukata de l'un à l'autre.","cout":1500,"kind":"rest"},{"h":"14h00","quoi":"Déjeuner au village","note":"","cout":1800,"kind":"eat"},{"h":"16h00","quoi":"Poser ses affaires au ryokan","note":"<b>La nuit à ne pas économiser du voyage.</b> Demi-pension, futon au sol. C'est le seul hébergement cher de la trame, et il le vaut.","cout":0,"kind":"stay"},{"h":"18h30","quoi":"Le dîner de la maison","note":"Une dizaine de petits plats de montagne : truite, légumes sauvages, bœuf de Kumamoto.","cout":0,"kind":"eat"},{"h":"20h30","quoi":"Les yuakari","note":"De décembre à mars, le village allume chaque soir des <b>lanternes de bambou tressé</b> le long de la rivière. C'est la raison de venir l'hiver plutôt qu'à l'automne, et elle suffit.","cout":0,"kind":"walk"}],"note":"Dates des yuakari à confirmer auprès du syndicat d'initiative : elles bougent d'une année sur l'autre. Sur ces dates la nuit tombe un <b>mardi</b> : c'est le tarif de semaine, le plus bas, et le village est à peu près vide."},{"n":10,"etape":"kumamoto","titre":"Redescendre à son rythme","blocs":[{"h":"07h30","quoi":"Bain du matin","note":"Le bain extérieur avant le petit déjeuner, quand il gèle encore. C'est pour ça qu'on vient l'hiver, et c'est la meilleure demi-heure du voyage.","cout":0,"kind":"rest"},{"h":"10h00","quoi":"Le village au réveil","note":"Les boutiques ouvrent tard. Une heure à flâner le long de la rivière, un café dans une maison de bois, la boutique de pâtisseries au marron.","cout":800,"kind":"walk"},{"h":"12h30","quoi":"Bus vers Kumamoto","note":"2 h 30 en redescendant l'Aso. Se placer à droite : la caldeira défile pendant une heure.","cout":3000,"kind":"move"},{"h":"15h30","quoi":"Kumamoto, l'après-midi libre","note":"Le quartier de Kamitori sous ses arcades, un café, la librairie. <b>Une après-midi sans programme au milieu du voyage</b>, c'est délibéré.","cout":0,"kind":"rest"},{"h":"19h00","quoi":"Ramen de Kumamoto","note":"À l'ail noir grillé, plus épais que celui de Fukuoka.","cout":1200,"kind":"eat"}],"note":"<b>Takachiho a été retiré de la trame</b> : quatre heures de car aller-retour pour trente minutes de barque, c'est le plus mauvais rapport du voyage. Si les gorges te tentent quand même, cette journée est celle où les caser — en partant à 7 h."},{"n":11,"etape":"nagasaki","titre":"La fenêtre du Japon fermé","blocs":[{"h":"09h30","quoi":"Train jusqu'à Nagasaki","note":"1 h 55 avec un changement à Shin-Tosu, sur la ligne à grande vitesse ouverte en 2022.","cout":9100,"kind":"move"},{"h":"11h30","quoi":"Déposer le sac","note":"La ville tient dans une baie étroite : tout se fait à pied ou en tramway, à 140 ¥ le trajet.","cout":0,"kind":"stay"},{"h":"13h30","quoi":"Dejima","note":"<b>Pendant deux cent dix ans, cet îlot en éventail a été le seul point de contact entre le Japon et l'Occident.</b> Les Hollandais y étaient consignés, et tout ce qui est entré de science européenne est passé par là. Une quinzaine de bâtiments reconstruits à l'identique.","cout":520,"kind":"see"},{"h":"16h00","quoi":"Le quartier chinois et le pont aux lunettes","note":"Shinchi, un des trois quartiers chinois du Japon. Le Megane-bashi, de 1634, se reflète en deux cercles quand la rivière est calme.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Champon","note":"Nouilles épaisses, porc, fruits de mer et légumes dans un bouillon blanc — inventé ici pour nourrir les étudiants chinois pauvres.","cout":1200,"kind":"eat"}],"note":""},{"n":12,"etape":"nagasaki","titre":"Ce qui s'est passé ici","blocs":[{"h":"09h00","quoi":"Musée de la bombe atomique","note":"Le 9 août 1945 à 11 h 02. Le musée est chronologique, factuel et très dur — surtout la salle des objets. Prévoir de ne rien faire de lourd après.","cout":200,"kind":"see"},{"h":"11h00","quoi":"L'hypocentre et le parc de la Paix","note":"Une colonne noire marque le point exact, à cinq cents mètres au-dessus duquel la bombe a explosé. Autour, les pans de la cathédrale Urakami laissés en place.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner tranquille","note":"","cout":1200,"kind":"eat"},{"h":"14h30","quoi":"Le sanctuaire au torii d'une jambe","note":"Sanno-jinja : le souffle en a emporté la moitié, et il tient debout ainsi depuis. À côté, deux camphriers calcinés qui ont refeuillé l'année suivante.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Une fin d'après-midi vide","note":"Volontairement. Un café, la chambre, la baie.","cout":0,"kind":"rest"}],"note":"La journée la plus lourde du voyage. Elle est placée en début d'étape pour ne pas finir dessus."},{"n":13,"etape":"nagasaki","titre":"Gunkanjima","blocs":[{"h":"09h00","quoi":"Bateau pour Hashima","note":"Une île de deux cents mètres sur quatre cents, couverte d'immeubles de béton vides — <b>la plus forte densité humaine jamais atteinte</b> quand cinq mille mineurs y vivaient. Fermée en 1974, abandonnée telle quelle.","cout":4500,"kind":"move"},{"h":"10h30","quoi":"Débarquement","note":"On ne visite qu'un couloir sécurisé au sud, le reste s'écroule. La sortie est annulée si la houle dépasse 50 cm — <b>compter un jour de repli</b>.","cout":310,"kind":"see"},{"h":"13h00","quoi":"Déjeuner au retour","note":"Sur le port.","cout":1500,"kind":"eat"},{"h":"15h00","quoi":"Glover Garden","note":"Les maisons des marchands occidentaux du XIXᵉ, sur la pente, avec vue sur la baie. Celle de Glover est la plus ancienne maison de style occidental du Japon.","cout":620,"kind":"see"},{"h":"17h00","quoi":"Oura, et les chrétiens cachés","note":"La plus ancienne église du pays. En 1865, des paysans y ont avoué à un prêtre français que leurs familles pratiquaient en secret depuis <b>sept générations</b>, sans prêtre ni livre.","cout":1000,"kind":"see"},{"h":"20h00","quoi":"Le mont Inasa","note":"Téléphérique jusqu'à 333 m. La baie en fer à cheval, illuminée — une des vues de nuit les plus réputées du pays.","cout":1250,"kind":"see"}],"note":""},{"n":14,"etape":"nagasaki","titre":"Unzen, ou la ville","blocs":[{"h":"08h30","quoi":"Bus pour Unzen","note":"1 h 40 par la péninsule de Shimabara.","cout":1850,"kind":"move"},{"h":"10h30","quoi":"Les Enfers d'Unzen","note":"Des fumerolles en plein village, avec des passerelles entre les évents. C'est là qu'on a exécuté des chrétiens en les ébouillantant au XVIIᵉ — le lieu porte les deux histoires.","cout":0,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner et bain","note":"Les auberges du village ouvrent leurs bains à la journée.","cout":2200,"kind":"rest"},{"h":"15h00","quoi":"Retour sur Nagasaki","note":"","cout":1850,"kind":"move"},{"h":"18h00","quoi":"Shippoku, si l'envie est là","note":"La table sino-portugaise de Nagasaki, servie à partager sur un plateau rond — ce qui, au Japon, ne se fait nulle part ailleurs. Se réserve à trois minimum, donc c'est jouable.","cout":5000,"kind":"eat"}],"note":"Variante si la sortie à Gunkanjima a été annulée la veille : c'est le jour de repli."},{"n":15,"etape":"fukuoka","titre":"Vers le nord","blocs":[{"h":"09h30","quoi":"Train jusqu'à Hakata","note":"1 h 30 avec un changement à Takeo-Onsen.","cout":6600,"kind":"move"},{"h":"11h10","quoi":"Déposer le sac","note":"La gare de Hakata est une ville : dix étages de boutiques et de restaurants au-dessus des quais.","cout":0,"kind":"stay"},{"h":"13h00","quoi":"Shofuku-ji","note":"<b>Le premier temple zen du Japon</b>, fondé en 1195 par le moine qui a rapporté le thé de Chine. On y entre librement, il n'y a rien à payer et presque personne.","cout":0,"kind":"see"},{"h":"15h00","quoi":"Kushida-jinja et le parc Ohori","note":"Le char de festival de dix mètres gardé toute l'année, puis un ancien fossé de château devenu lac. Deux kilomètres à plat, et c'est là que la ville se promène.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Yatai","note":"Cent trente baraques montées chaque soir sur les trottoirs de Nakasu et Tenjin, démontées à l'aube. Huit tabourets, un rideau. <b>Ça n'existe plus qu'ici</b> — et c'est le meilleur endroit du voyage pour parler à quelqu'un quand on voyage seul.","cout":2500,"kind":"eat"}],"note":""},{"n":16,"etape":"fukuoka","titre":"Arita et Imari","blocs":[{"h":"08h20","quoi":"Limited express jusqu'à Arita","note":"1 h 20 vers l'ouest, à travers les collines de Saga.","cout":2800,"kind":"move"},{"h":"09h45","quoi":"Arita, la ville de la porcelaine","note":"<b>La première porcelaine du Japon y a été cuite en 1616</b>, par des potiers coréens amenés de force après les campagnes de Hideyoshi. La ville n'a jamais fait autre chose depuis.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le musée Kyushu Ceramic","note":"Quatre siècles de production, dont la collection Shibata — dix mille pièces d'Imari d'exportation. Gratuit.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Arita","note":"Servi dans de la porcelaine locale, forcément.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Le quartier des fours","note":"Uchiyama, une rue de kilns et d'ateliers, avec les murs de tessons — les rebuts de quatre siècles, encastrés dans les clôtures.","cout":0,"kind":"walk"},{"h":"15h30","quoi":"Peindre une pièce","note":"Plusieurs ateliers font décorer une tasse au pinceau, cuite ensuite et expédiée. Compter un mois pour la recevoir.","cout":2500,"kind":"see"},{"h":"17h00","quoi":"Retour sur Fukuoka","note":"","cout":2800,"kind":"move"}],"note":""},{"n":17,"etape":"fukuoka","titre":"Dazaifu","blocs":[{"h":"09h30","quoi":"Nishitetsu jusqu'à Dazaifu","note":"45 minutes depuis Tenjin. Certaines rames sont dessinées par un designer de trains célèbre.","cout":420,"kind":"move"},{"h":"10h30","quoi":"Tenman-gu","note":"Le sanctuaire des études, où les lycéens viennent avant les examens. <b>Six mille pruniers</b>, et un bœuf de bronze qu'on frotte à la tête. Début mars la floraison bat son plein — c'est la première de l'année, un mois avant les cerisiers.","cout":0,"kind":"see"},{"h":"12h00","quoi":"Komozen-ji","note":"À deux minutes, et presque personne : un jardin de mousse et de pierres qu'on regarde assis sur la véranda de bois. Deux cents yens dans une boîte.","cout":200,"kind":"rest"},{"h":"13h00","quoi":"Umegae-mochi","note":"La galette de riz grillée fourrée de haricot rouge, vendue tout le long de l'allée. Un four tous les dix mètres.","cout":1200,"kind":"eat"},{"h":"14h30","quoi":"Musée national de Kyushu","note":"Un des quatre musées nationaux du pays, dans un bâtiment de verre courbe adossé à la colline. Il raconte le Japon par ses échanges avec le continent — ce qui est tout le sujet de cette étape.","cout":700,"kind":"see"},{"h":"18h00","quoi":"Derniers yatai","note":"La dernière soirée de Kyushu.","cout":2500,"kind":"eat"}],"note":"Dazaifu a sa journée entière au lieu d'être collé à l'après-midi d'arrivée."},{"n":18,"etape":"hakone","titre":"Kyushu le matin, la montagne le soir","blocs":[{"h":"08h00","quoi":"Petit déjeuner et sac","note":"Les sous-sols de la gare de Hakata pour les cadeaux qui voyagent mal : mentaiko sous vide, gâteaux de Kyushu.","cout":0,"kind":"stay"},{"h":"11h15","quoi":"Métro jusqu'à l'aéroport","note":"<b>Onze minutes depuis la gare de Hakata.</b> Fukuoka a l'aéroport le mieux placé du pays.","cout":260,"kind":"move"},{"h":"12h15","quoi":"Vol Fukuoka → Haneda","note":"<b>NH252</b>, 1 h 40, <b>compris dans le billet</b>. Onze vols entre 9 h et 14 h 30 : de la marge si le matin déborde.","cout":0,"kind":"move"},{"h":"14h45","quoi":"Monorail, puis Shinjuku","note":"Une heure. <b>Prendre le Hakone Freepass au guichet Odakyu</b> : il couvre le train, la crémaillère, le funiculaire, le téléphérique, le bateau du lac et tous les bus de la zone, pendant deux ou trois jours.","cout":6100,"kind":"move"},{"h":"16h20","quoi":"Romancecar jusqu'à Hakone-Yumoto","note":"1 h 25 depuis Shinjuku. Supplément de 1 200 ¥ pour des sièges réservés — qui se justifie après un vol. Les premières voitures ont une baie vitrée à l'avant.","cout":1200,"kind":"move"},{"h":"18h00","quoi":"Poser le sac, et le premier bain","note":"Hakone-Yumoto est une ville d'eau depuis 738. Après trois semaines de villes et un vol, c'est le bon ordre des choses.","cout":0,"kind":"rest"},{"h":"19h30","quoi":"Tofu de Hakone","note":"Monté à l'eau de source, servi en une dizaine de préparations dans les maisons de la rue principale.","cout":2500,"kind":"eat"}],"note":"Journée de transition longue mais sans rupture : un vol, deux trains, et on dort dans une vallée thermale."},{"n":19,"etape":"hakone","titre":"Le tour du volcan","blocs":[{"h":"08h30","quoi":"La crémaillère jusqu'à Gora","note":"40 minutes et 500 m de dénivelé sur <b>le plus vieux train de montagne du Japon</b>, qui monte en trois rebroussements : le conducteur et le contrôleur échangent de cabine à chaque fois.","cout":0,"kind":"move"},{"h":"09h30","quoi":"Funiculaire, puis téléphérique","note":"Compris dans le pass. À l'instant où la cabine bascule au-dessus de la crête, <b>le Fuji apparaît d'un coup</b> en face. En février il est enneigé jusqu'aux deux tiers.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Owakudani","note":"La vallée qui fume, ouverte par une éruption il y a trois mille ans. On y cuit des œufs dans l'eau sulfureuse : ils en ressortent <b>noirs</b>, et la coutume veut que chacun ajoute sept ans de vie. <b>La zone ferme sans préavis</b> quand les gaz montent — se renseigner la veille.","cout":500,"kind":"see"},{"h":"12h30","quoi":"Bateau sur le lac Ashi","note":"Compris dans le pass. Une caldeira remplie d'eau, et le Fuji au bout par temps clair. Se placer à l'avant, à bâbord.","cout":0,"kind":"move"},{"h":"13h30","quoi":"Déjeuner à Motohakone","note":"","cout":1800,"kind":"eat"},{"h":"15h00","quoi":"Hakone-jinja et le torii du lac","note":"Le sanctuaire est dans une futaie de cryptomères, et son <b>torii vermillon est planté dans l'eau</b>, au bord du lac. Fondé en 757, sur la route que tout le monde devait emprunter entre Kyoto et Edo.","cout":0,"kind":"see"},{"h":"17h00","quoi":"Rentrer par le bus","note":"Compris dans le pass. Puis le bain, encore.","cout":0,"kind":"rest"}],"note":"C'est le <b>Hakone Round Course</b> : une boucle qui ne revient jamais sur ses pas, et dont le pass couvre chacun des six moyens de transport. Sur ces dates il tombe un <b>vendredi</b> : l'excursion favorite des Tokyoïtes se fait donc hors du week-end, et l'ancienne route du lendemain absorbe le samedi, bien plus calme."},{"n":20,"etape":"hakone","titre":"L'ancienne route du Tokaido","blocs":[{"h":"09h00","quoi":"La cédraie du Tokaido","note":"Un kilomètre de l'<b>ancienne route de Kyoto à Edo</b>, bordé de quatre cents cryptomères plantés en 1618 pour abriter les voyageurs. On marche sur les pavés d'origine — c'est la route des cinquante-trois stations.","cout":0,"kind":"walk"},{"h":"10h00","quoi":"Le poste de contrôle de Hakone","note":"Reconstruit à l'identique d'après les plans d'époque. <b>On y fouillait les voyageurs</b>, et surtout on empêchait les femmes des seigneurs de quitter Edo, où le shogun les gardait en otage. Les cellules, les armes et les registres sont là.","cout":500,"kind":"see"},{"h":"12h00","quoi":"Déjeuner, et le dernier bain","note":"Un onsen à ciel ouvert avant de redescendre.","cout":2500,"kind":"eat"},{"h":"15h00","quoi":"Le val de Sengokuhara","note":"Une plaine de hautes herbes argentées au nord du massif, avec le Fuji derrière. Vingt minutes de bus, compris dans le pass.","cout":0,"kind":"walk"},{"h":"18h00","quoi":"Kaiseki au ryokan","note":"Servi en chambre : une dizaine de petits plats, poisson de rivière, légumes de montagne. <b>Le dernier vrai repas du voyage</b>, et celui à ne pas économiser.","cout":0,"kind":"eat"}],"note":"Le poste de contrôle et la cédraie prolongent tout ce voyage : la route par étapes, celle des cinquante-trois stations."},{"n":21,"etape":"tokyo-fin","titre":"Un dernier matin, puis Tokyo","blocs":[{"h":"08h00","quoi":"Le bain avant tout le monde","note":"Le rotenburo au petit jour, quand la vapeur monte et qu'il gèle encore. C'est la dernière fois du voyage.","cout":0,"kind":"rest"},{"h":"10h00","quoi":"Le musée en plein air","note":"Cent sculptures dans un parc face aux montagnes — Moore, Miró, un pavillon entier de Picasso, et un bain de pieds chaud au milieu des œuvres. Le seul musée du voyage où l'on ressort les pieds au chaud.","cout":1600,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Gora","note":"","cout":2000,"kind":"eat"},{"h":"15h00","quoi":"Romancecar jusqu'à Shinjuku","note":"1 h 25, compris dans le pass hors supplément.","cout":1200,"kind":"move"},{"h":"17h00","quoi":"Poser le sac à Tokyo","note":"Sur la Yamanote, à portée de Kappabashi et de Ginza. Haneda est à 45 minutes de là.","cout":0,"kind":"stay"},{"h":"19h30","quoi":"Retrouver la ville","note":"Après trois semaines de province et de montagne, Tokyo au retour ne ressemble pas à Tokyo à l'aller.","cout":2500,"kind":"eat"}],"note":"La troisième nuit de Hakone sert à ça : ne pas enchaîner le Round Course, l'ancienne route et le retour sur Tokyo en deux jours."},{"n":22,"etape":"tokyo-fin","titre":"Kappabashi, et le reste","blocs":[{"h":"09h00","quoi":"Kappabashi","note":"La rue des fournisseurs de restaurants, entre Ueno et Asakusa. Couteaux forgés, moules à pâtisserie, vaisselle au kilo, répliques de plats en résine. <b>C'est là qu'on achète un couteau qui durera trente ans</b>, gravé à son nom devant soi — et il faut du temps pour choisir, d'où cette journée.","cout":0,"kind":"see"},{"h":"12h00","quoi":"Déjeuner à Asakusa","note":"","cout":1500,"kind":"eat"},{"h":"13h30","quoi":"Senso-ji et Nakamise","note":"Le plus vieux temple de Tokyo, à dix minutes à pied. La grande lanterne, et la rue d'échoppes qui y mène.","cout":0,"kind":"walk"},{"h":"16h00","quoi":"Ameyoko","note":"Le marché sous les voies, à Ueno : ce qui reste du marché noir d'après-guerre. Épices, poisson séché, thés en vrac, et des vendeurs qui hèlent — le contraire du Japon feutré.","cout":1500,"kind":"see"},{"h":"19h00","quoi":"Un izakaya de Yanaka","note":"Sans carte en anglais, avec des habitués.","cout":3000,"kind":"eat"}],"note":"Les achats se font ici, pas le dernier jour : le vol part à 9 h 50 et Kappabashi n'ouvre qu'à 9 h."},{"n":23,"etape":"tokyo-fin","titre":"Le dernier jour","blocs":[{"h":"09h30","quoi":"Ce qu'on avait laissé","note":"Une matinée sans programme, la dernière. Le musée qu'on a raté, le quartier qu'on voulait revoir, ou rien du tout.","cout":0,"kind":"rest"},{"h":"13h00","quoi":"Dépachika","note":"Les sous-sols alimentaires des grands magasins de Ginza ou de Shinjuku. C'est là qu'on prend les cadeaux : thés, sucreries, sauces, emballés comme des bijoux. <b>Tout se garde plusieurs semaines</b>, contrairement à ce qu'on trouve à l'aéroport.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Faire la valise","note":"Prévoir large à la pesée : Arita, Kappabashi et les dépachika laissent des traces. C'est le moment de savoir si l'option second bagage était une bonne idée.","cout":0,"kind":"stay"},{"h":"18h00","quoi":"Un dernier bain","note":"Le sento du quartier, à 550 ¥. Partir propre après trois semaines et demie.","cout":550,"kind":"rest"},{"h":"19h30","quoi":"Le dernier repas","note":"Celui qu'on s'était promis. Ne pas se coucher trop tard : lever à 5 h 45.","cout":4000,"kind":"eat"}],"note":"Journée délibérément vide. C'est ce que les trois nuits gagnées sur le vol ont acheté."},{"n":24,"etape":"tokyo-fin","titre":"Retour","blocs":[{"h":"05h45","quoi":"Lever","note":"<b>NH215 décolle à 9 h 50</b> : il n'y a pas de dernière matinée. Tout ce qu'on voulait rapporter a été acheté avant-hier à Kappabashi et hier aux dépachika.","cout":0,"kind":"rest"},{"h":"06h50","quoi":"Yamanote puis monorail","note":"50 minutes jusqu'au terminal international. Les premiers trains partent vers 5 h.","cout":800,"kind":"move"},{"h":"07h50","quoi":"Comptoir, puis détaxe","note":"Deux heures avant le vol. Si des achats ont été détaxés, le guichet des douanes est <b>avant</b> la sécurité et prend du temps.","cout":0,"kind":"move"},{"h":"09h50","quoi":"Vol Haneda → Paris CDG","note":"<b>NH215</b>, direct, 14 h 40. Arrivée à Paris le même jour à 16 h 30 : on regagne les huit heures perdues à l'aller.","cout":0,"kind":"move"}],"note":"Départ de Paris le <b>17 février au soir</b>, retour le <b>10 mars</b>. Ce n'est pas un hasard : sur la fenêtre autorisée, <b>le retour du 10 mars est 35 à 48 % moins cher</b> que ceux du 11 au 14, à durée comparable."}],"resa":[{"quoi":"Le billet ANA avec la promotion TOKYO+","quand":"<b>avant le 30 septembre 2026</b>","note":"La mise en vente ne dure qu'un mois. Demander les deux vols intérieurs <b>dans la même réservation</b> : Haneda → Kagoshima et Fukuoka → Haneda. <b>Les deux aéroports intérieurs peuvent différer</b> — c'est l'itinéraire B donné en exemple par ANA : Tokyo → Fukuoka à l'aller, Hiroshima → Tokyo au retour, le trajet terrestre entre les deux restant à la charge du voyageur. Réserver via « <b>Rechercher plusieurs villes</b> », en saisissant les segments dans l'ordre et en terminant par le vol retour.","critique":true},{"quoi":"Tokyo à l'aller, Hakone au retour","quand":"à la réservation","note":"Trois nuits à l'aller et trois au retour, dont deux passées à Hakone : <b>la formule passe</b> — elle a déjà été réservée telle quelle sur cette même offre l'an dernier. C'est la logique du produit : les vols internationaux d'ANA arrivent à Tokyo, et le domestique sert à aller ailleurs. Demander simplement les deux segments dans la même réservation.","critique":false},{"quoi":"L'option second bagage, sur le retour","quand":"à la réservation, ou plus tard","note":"ANA n'inclut plus qu'<b>une pièce de 23 kg</b> au départ de Paris — vérifié sur un vol effectué en 2025. La seconde coûte un peu plus de 100 € <b>par trajet</b> : ne la prendre que sur le retour, quand la valise est pleine d'Arita et de Kappabashi.","critique":false},{"quoi":"Le ryokan de Hakone","quand":"2 mois avant","note":"Trois nuits, dont une avec bain privatif pour finir. Hakone est la station thermale de Tokyo : les trois nuits tombent jeudi, vendredi et <b>samedi</b> — cette dernière est la plus chère : garder le ryokan avec bain privatif pour le jeudi ou le vendredi, et une auberge simple le samedi.","critique":false},{"quoi":"Le ryokan de Kurokawa","quand":"3 mois avant","note":"Une seule nuit, mais c'est la nuit du voyage. Les bonnes maisons partent tôt, et l'hiver est leur haute saison. Sur ces dates elle tombe un <b>mardi</b>, au tarif de semaine.","critique":true},{"quoi":"La sortie à Gunkanjima","quand":"2 mois avant","note":"Sièges limités, et <b>annulée si la houle dépasse 50 cm</b> — l'hiver est la saison la plus agitée. Garder le jour 15 en repli.","critique":false},{"quoi":"Les hébergements","quand":"2 mois avant","note":"Six réservations, dont deux fois la même à Tokyo. En solo, guesthouses et business hotels se trouvent tard — sauf Kurokawa.","critique":false},{"quoi":"L'atelier de porcelaine à Arita","quand":"3 semaines avant","note":"La pièce est cuite après le départ et expédiée : compter un mois.","critique":false},{"quoi":"Cratère de l'Aso, et gaz d'Owakudani","quand":"le matin même","note":"Les deux ferment sans préavis selon les gaz. L'Aso par la neige aussi. Chaque site publie son niveau le jour même.","critique":false}],"budget":[["Vol A/R","ANA direct CDG–Haneda, <b>les deux vols intérieurs compris</b>. Relevé sur le tunnel ANA le 02/09/2026",993],["Second bagage","Option achetée <b>sur le retour seulement</b> : on part léger, on revient chargé",105],["Hébergement","23 nuits : guesthouses, un ryokan à Kurokawa, trois nuits à Hakone",1024],["Transport","131 € entre les étapes, 180 € d'excursions, le Hakone Freepass, 7 €/jour de local",502],["Nourriture","35 € par jour",840],["Activités","Entrées, Gunkanjima, bain de sable, atelier de porcelaine",164],["Divers","eSIM, assurance, souvenirs",200]]}],"scenes":{"alpes:kyoto":"<svg class=\"scene\" viewBox=\"0 0 1500 380\" preserveAspectRatio=\"xMidYMid slice\" role=\"presentation\" aria-hidden=\"true\"><defs><linearGradient id=\"sk68172\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\ // ————————————————————————————— vue : jour par jour —————————————————————————————
function vJours() {

    '<p class="lede">Les horaires sont indicatifs, les prix par personne et en yens. ' +
    'Cliquer un moment le barre — c\'est fait, ou c\'est abandonné. Chaque journée a un bloc de notes.</p>';

  var cur = null;
  t.jours.forEach(function (d) {
    if (d.etape !== cur) {

      var e = etape(t, cur);

      h += '<div class="dayhead"><span class="kj">' + e.kanji + '</span><h3>' + e.nom + '</h3>' +

  });
  return h + '</section></div>' + pied();
}

function bloc(t, d) {
  var cles = d.blocs.map(function (_, i) { return t.id + ":" + d.n + ":" + i; });
  var barres = cles.filter(function (c) { return S.faits[c]; }).length;

  var ouv = S.ouverts[t.id + ":" + d.n];
  var cout = d.blocs.reduce(function (a, b, i) { return a + (S.faits[cles[i]] ? 0 : b.cout); }, 0);
  var e = etape(t, d.etape);

  var h = '<article class="day' + (ouv ? ' open' : '') + (fini ? ' done' : '') + '" data-day="' + d.n + '">' +
    '<button class="dh" data-open="' + d.n + '" aria-expanded="' + (ouv ? "true" : "false") + '">' +
    '<span class="dn">J' + d.n + '</span><span class="dt"><span class="t">' + d.titre + '</span>' +
    '<span class="s">' + (dateDuJour(t, d.n) ? dateDuJour(t, d.n) + ' · ' : '') +
    e.nom + ' · ' + d.blocs.length + ' moments' +
    (cout ? ' · ' + yen(cout) : '') + (barres ? ' · ' + barres + ' barré' + (barres > 1 ? 's' : '') : '') +
    '</span></span>' + I.chev + '</button><div class="dbody">';

  d.blocs.forEach(function (b, i) {
    var c = cles[i], off = S.faits[c];

      '</div>';
  });

  if (d.note) h += '<div class="dnote"><b>À savoir</b>' + d.note + '</div>';
  h += '<div class="dsum"><span>Coût restant, par personne <b>' + yen(cout) + '</b> — soit ' +
       Math.round(cout / YEN) + ' €</span><span>À trois <b>' + yen(cout * 3) + '</b></span></div>';
  h += '<textarea class="jot" aria-label="Notes du jour ' + d.n + '" data-note="' + t.id + ":" + d.n + '" placeholder="Notes du jour ' + d.n +
