<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet du Japon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --washi:#EFEFEA; --sheet:#FAFAF7; --card:#FFFFFF;
  --sumi:#1A1D19; --encre:#3E4238; --pale:#767B6E; --trait:#DCDCD3;
  --bero:#1D3E63; --beni:#B23A2E; --clay:#8A6A3F; --moss:#4A6247; --ambre:#C6873C;
  --side:#191C18; --side-t:#E7E7DF; --side-p:#8D9186; --side-a:#2A2E27;
  --sc-a:#F0B978; --sc-b:#C4694A; --sc-c:#BFD4DF; --sc-d:#F1D9B0;
  --sc-e:#AFC9DE; --sc-f:#E4EDF2;
  --sc-l1:#8E6B57; --sc-l2:#6D5A50; --sc-l3:#463F3C; --sc-l4:#252523;
  --sc-sig:#1A1614; --sc-astre:#FBE9C8;
  --f-disp:"Petrona",Georgia,"Times New Roman",serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --sidew:270px;
  --m-sea:#E4E8E4; --m-land:#D3D6CE; --m-coast:#B7BCB0; --m-ink:#1A1D19; --m-muted:#7B8074;
  --m-route:var(--bero); --m-air:var(--beni); --m-exc:var(--clay);
  --m-stop:var(--bero); --m-onstop:#FFFFFF;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --washi:#12140F; --sheet:#181B15; --card:#1E211B;
  --sumi:#E9EAE2; --encre:#C6C9BC; --pale:#8B9083; --trait:#2E322A;
  --bero:#7FA6CE; --beni:#DE8878; --clay:#BFA075; --moss:#8FAE88; --ambre:#D9A768;
  --side:#0C0E0A; --side-t:#E4E5DC; --side-p:#7E8377; --side-a:#1C2018;
  --sc-a:#8A5B3E; --sc-b:#4A2C2A; --sc-c:#3E566A; --sc-d:#8A7050;
  --sc-e:#3B546B; --sc-f:#6C8296;
  --sc-l1:#4E3B31; --sc-l2:#3B322C; --sc-l3:#2A2624; --sc-l4:#181817;
  --sc-sig:#0A0908; --sc-astre:#C4A57A;
  --m-sea:#0E1210; --m-land:#232821; --m-coast:#39402F; --m-ink:#E9EAE2; --m-muted:#8B9083;
  --m-route:#7FA6CE; --m-air:#DE8878; --m-exc:#BFA075; --m-stop:#7FA6CE; --m-onstop:#0E1720;
}}
:root[data-theme="dark"]{
  --washi:#12140F; --sheet:#181B15; --card:#1E211B;
  --sumi:#E9EAE2; --encre:#C6C9BC; --pale:#8B9083; --trait:#2E322A;
  --bero:#7FA6CE; --beni:#DE8878; --clay:#BFA075; --moss:#8FAE88; --ambre:#D9A768;
  --side:#0C0E0A; --side-t:#E4E5DC; --side-p:#7E8377; --side-a:#1C2018;
  --sc-a:#8A5B3E; --sc-b:#4A2C2A; --sc-c:#3E566A; --sc-d:#8A7050;
  --sc-e:#3B546B; --sc-f:#6C8296;
  --sc-l1:#4E3B31; --sc-l2:#3B322C; --sc-l3:#2A2624; --sc-l4:#181817;
  --sc-sig:#0A0908; --sc-astre:#C4A57A;
  --m-sea:#0E1210; --m-land:#232821; --m-coast:#39402F; --m-ink:#E9EAE2; --m-muted:#8B9083;
  --m-route:#7FA6CE; --m-air:#DE8878; --m-exc:#BFA075; --m-stop:#7FA6CE; --m-onstop:#0E1720;
}

*{box-sizing:border-box}
body{margin:0;background:var(--washi);color:var(--encre);
  font-family:var(--f-body);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);color:var(--sumi);margin:0;line-height:1.14;font-weight:600}
b,strong{color:var(--sumi);font-weight:600}
em{font-style:italic}
a{color:var(--bero)}
button{font:inherit;color:inherit}

/* ————————————————————————— charpente ————————————————————————— */
.wrap{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);min-height:100vh}

.side{background:var(--side);color:var(--side-t);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--side-a);display:flex;gap:13px;align-items:flex-start}
.brand .mk{font-family:var(--f-disp);font-size:27px;line-height:1;color:var(--beni);
  writing-mode:vertical-rl;letter-spacing:.14em;padding-top:2px}
.brand .bt{font-family:var(--f-disp);font-size:19px;color:var(--side-t);line-height:1.2}
.brand .bs{font-family:var(--f-num);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--side-p);margin-top:5px}

.pick{padding:14px 14px 4px}
.pick label{font-family:var(--f-num);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--side-p);display:block;margin:0 6px 7px}
.pick select{width:100%;background:var(--side-a);color:var(--side-t);border:1px solid transparent;
  border-radius:9px;padding:9px 10px;font-size:13.5px;cursor:pointer}
.pick select:focus{outline:none;border-color:var(--beni)}

.nav{padding:12px 10px;flex:1}
.nav .grp{font-family:var(--f-num);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--side-p);margin:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--side-t);text-align:left;font-size:14px}
.nav button:hover{background:var(--side-a)}
.nav button[aria-current="true"]{background:var(--side-a);color:#fff;font-weight:600}
.nav button[aria-current="true"] .ic{color:var(--beni)}
.nav .ic{width:17px;height:17px;flex:none;color:var(--side-p)}
.nav .tag{margin-left:auto;font-family:var(--f-num);font-size:10.5px;color:var(--side-p)}
.nav .stp{padding-left:14px;font-size:13px;color:var(--side-p)}
.nav .stp:hover{color:var(--side-t)}
.nav .stp .no{font-family:var(--f-num);font-size:10.5px;width:15px;color:var(--beni)}

.tools{padding:12px 14px 18px;border-top:1px solid var(--side-a);display:flex;flex-wrap:wrap;gap:7px}
.tools button{background:var(--side-a);border:0;border-radius:8px;padding:7px 11px;
  font-size:12px;cursor:pointer;color:var(--side-p)}
.tools button:hover{color:var(--side-t)}

.main{min-width:0;padding:0 0 90px}
.view{display:none;animation:in .22s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pad{padding:0 40px;max-width:1080px}

/* ————————————————————————— scènes ————————————————————————— */
.scene{display:block;width:100%;height:100%;position:absolute;inset:0}
.hero{position:relative;height:290px;overflow:hidden;display:flex;align-items:flex-end}
.hero .in{position:relative;padding:0 40px 26px;max-width:1080px;width:100%}
.hero h1{font-size:clamp(34px,4.6vw,54px);color:#FBFBF6;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.hero h1 em{color:#F6D9A8}
.hero .deck{color:#EDE9DF;max-width:60ch;margin:11px 0 0;text-shadow:0 1px 14px rgba(0,0,0,.6);font-size:15.5px}
.hero .seal{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-num);font-size:10.5px;
  letter-spacing:.19em;text-transform:uppercase;color:#F3E4CB;margin-bottom:13px;
  text-shadow:0 1px 10px rgba(0,0,0,.7)}
.hero .seal i{width:11px;height:11px;background:var(--beni);display:block;border-radius:2px}

/* ————————————————————————— blocs communs ————————————————————————— */
.eyebrow{font-family:var(--f-num);font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--beni);margin:0 0 9px}
h2{font-size:clamp(23px,2.5vw,31px);margin:0 0 6px}
h2 em{color:var(--bero)}
.lede{color:var(--pale);max-width:64ch;margin:0 0 20px}
section{padding:44px 0 4px}
.card{background:var(--card);border:1px solid var(--trait);border-radius:var(--r)}

.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  background:var(--trait);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;margin:26px 0 0}
.tally .c{background:var(--card);padding:15px 17px}
.tally .k{font-family:var(--f-num);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--pale)}
.tally .v{font-family:var(--f-num);font-size:25px;color:var(--sumi);margin-top:3px;font-weight:500}
.tally .c.hi .v{color:var(--beni)}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(238px,1fr))}

/* étapes en vitrine */
.stcard{overflow:hidden;display:flex;flex-direction:column}
.stcard .top{position:relative;height:132px}
.stcard .lab{position:absolute;left:16px;bottom:12px;color:#FBFBF6;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.stcard .lab .n{display:block;font-family:var(--f-disp);font-size:25px;line-height:1.1}
.stcard .lab .k{display:block;font-family:var(--f-num);font-size:11px;letter-spacing:.14em;opacity:.86}
.stcard .no{position:absolute;right:14px;top:13px;width:29px;height:29px;border-radius:50%;
  background:rgba(12,12,10,.62);color:#fff;font-family:var(--f-num);font-size:13px;
  display:grid;place-items:center;backdrop-filter:blur(3px)}
.stcard .bd{padding:15px 17px 17px;flex:1;display:flex;flex-direction:column;gap:11px}
.stcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-num);font-size:10.5px;letter-spacing:.05em;padding:3.5px 9px;border-radius:99px;
  background:color-mix(in srgb,var(--bero) 11%,transparent);color:var(--bero);white-space:nowrap}
.pill.w{background:color-mix(in srgb,var(--ambre) 15%,transparent);color:var(--clay)}
.pill.m{background:color-mix(in srgb,var(--moss) 14%,transparent);color:var(--moss)}
.pill.r{background:color-mix(in srgb,var(--beni) 12%,transparent);color:var(--beni)}
.stcard .why{color:var(--pale);font-size:14px;margin:0}
.stcard ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--pale)}
.stcard li{margin:3px 0}

/* ————————————————————————— jour par jour ————————————————————————— */
.dayhead{display:flex;align-items:center;gap:14px;margin:34px 0 13px;padding-top:8px}
.dayhead .kj{font-family:var(--f-disp);font-size:20px;color:var(--beni)}
.dayhead h3{font-size:20px}
.dayhead .rule{flex:1;height:1px;background:var(--trait)}
.dayhead .cnt{font-family:var(--f-num);font-size:11px;color:var(--pale)}

.day{border:1px solid var(--trait);border-radius:var(--r);background:var(--card);margin-bottom:11px;overflow:hidden}
.day.done{opacity:.62}
.dh{display:flex;align-items:center;gap:14px;padding:14px 17px;cursor:pointer;user-select:none;width:100%;
  background:none;border:0;text-align:left}
.dh:hover{background:color-mix(in srgb,var(--bero) 4%,transparent)}
.dn{font-family:var(--f-num);font-size:12px;color:var(--card);background:var(--bero);
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:600}
.day.done .dn{background:var(--moss)}
.dt{flex:1;min-width:0}
.dt .t{display:block;font-family:var(--f-disp);font-size:17.5px;color:var(--sumi);line-height:1.25}
.dt .s{display:block;font-family:var(--f-num);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--pale);margin-top:2px}
.dh .chev{color:var(--pale);flex:none;transition:transform .2s}
.day.open .chev{transform:rotate(180deg)}
.dbody{display:none;padding:2px 17px 17px;border-top:1px solid var(--trait)}
.day.open .dbody{display:block}

.blk{display:grid;grid-template-columns:58px 22px 1fr auto;gap:12px;align-items:start;padding:11px 0;
  border-bottom:1px dashed var(--trait)}
.blk:last-of-type{border-bottom:0}
.blk .hh{font-family:var(--f-num);font-size:12px;color:var(--pale);padding-top:2px}
.blk .ic{width:19px;height:19px;color:var(--bero);margin-top:2px}
.blk.k-eat .ic{color:var(--beni)} .blk.k-move .ic{color:var(--pale)}
.blk.k-walk .ic{color:var(--moss)} .blk.k-rest .ic{color:var(--clay)}
.blk .q{display:block;color:var(--sumi);font-weight:600;font-size:14.5px}
.blk .nt{display:block;color:var(--pale);font-size:13.5px;margin-top:2px}
.blk .cc{font-family:var(--f-num);font-size:12px;color:var(--clay);white-space:nowrap;padding-top:2px}
.blk .cc small{color:var(--pale);display:block;font-size:10px;text-align:right}
.blk.tick{cursor:pointer}
.blk.tick:hover .q{color:var(--bero)}
.blk.off .q,.blk.off .nt{text-decoration:line-through;color:var(--pale)}

.dnote{margin-top:13px;padding:11px 13px;border-radius:10px;
  background:color-mix(in srgb,var(--ambre) 9%,transparent);
  border-left:3px solid var(--ambre);color:var(--encre);font-size:13.5px}
.dnote b{display:block;font-family:var(--f-num);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--clay);margin-bottom:3px}
.jot{width:100%;margin-top:11px;background:var(--sheet);border:1px solid var(--trait);border-radius:10px;
  padding:10px 12px;font:inherit;font-size:13.5px;color:var(--encre);resize:vertical;min-height:52px}
.jot:focus{outline:none;border-color:var(--bero)}
.dsum{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--trait);
  font-family:var(--f-num);font-size:11.5px;color:var(--pale)}
.dsum b{color:var(--sumi)}

/* ————————————————————————— carte ————————————————————————— */
.mapbox{background:var(--sheet);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:9px 20px;padding:14px 18px;border-top:1px solid var(--trait);
  font-family:var(--f-num);font-size:11px;color:var(--pale)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .dot{width:9px;height:9px;border-radius:50%;display:block}
.legend .sw{width:19px;height:2.5px;display:block;border-radius:2px}

/* ————————————————————————— budget ————————————————————————— */
.bar{height:9px;border-radius:99px;background:var(--trait);overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;background:var(--bero);border-radius:99px}
.bar.over i{background:var(--beni)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--trait);vertical-align:top}
th{font-family:var(--f-num);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--pale);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.sum td{background:color-mix(in srgb,var(--bero) 6%,transparent);font-weight:600;color:var(--sumi)}
.sheet{border:1px solid var(--trait);border-radius:var(--r);overflow:hidden;background:var(--card)}
.scroll{overflow-x:auto}

.qadd{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.qadd button{background:var(--card);border:1px solid var(--trait);border-radius:11px;padding:11px 9px;
  cursor:pointer;text-align:center;transition:.14s}
.qadd button:hover{border-color:var(--bero);transform:translateY(-1px)}
.qadd .q{display:block;font-size:13px;color:var(--sumi);font-weight:500}
.qadd .p{display:block;font-family:var(--f-num);font-size:11.5px;color:var(--clay);margin-top:2px}

.form{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:16px 0}
.form input,.form select{background:var(--card);border:1px solid var(--trait);border-radius:9px;
  padding:9px 11px;font:inherit;font-size:14px;color:var(--encre)}
.form input:focus,.form select:focus{outline:none;border-color:var(--bero)}
.form input[type=number]{width:104px;font-family:var(--f-num)}
.form .go{background:var(--bero);color:#fff;border:0;border-radius:9px;padding:10px 17px;cursor:pointer;font-weight:600}
.form .go:hover{filter:brightness(1.08)}

.ring{display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{font-family:var(--f-num);font-size:11px;color:var(--pale);text-align:center;margin-top:7px}

.spend{list-style:none;margin:0;padding:0}
.spend li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--trait);font-size:14px}
.spend li:last-child{border-bottom:0}
.spend .w{flex:1;min-width:0;color:var(--sumi)}
.spend .w small{display:block;color:var(--pale);font-family:var(--f-num);font-size:10.5px;letter-spacing:.06em}
.spend .a{font-family:var(--f-num);color:var(--clay);white-space:nowrap}
.spend .x{background:none;border:0;color:var(--pale);cursor:pointer;padding:3px 6px;border-radius:6px;line-height:1}
.spend .x:hover{color:var(--beni);background:color-mix(in srgb,var(--beni) 10%,transparent)}

/* ————————————————————————— listes à cocher ————————————————————————— */
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--trait);cursor:pointer}
.check li:last-child{border-bottom:0}
.check .bx{width:19px;height:19px;border:1.6px solid var(--trait);border-radius:5px;flex:none;margin-top:2px;
  display:grid;place-items:center;transition:.14s}
.check li.on .bx{background:var(--moss);border-color:var(--moss);color:#fff}
.check li.on .w{text-decoration:line-through;color:var(--pale)}
.check .w{flex:1;color:var(--sumi)}
.check .w small{display:block;color:var(--pale);font-size:13px;font-weight:400;text-decoration:none}
.check .when{font-family:var(--f-num);font-size:10.5px;color:var(--pale);white-space:nowrap;padding-top:3px}
.check li.crit .when{color:var(--beni)}

.note{border-left:3px solid var(--beni);background:color-mix(in srgb,var(--beni) 7%,transparent);
  padding:14px 17px;border-radius:0 10px 10px 0;margin:18px 0}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;font-size:14px;color:var(--pale)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;
  place-items:center;padding:22px;overflow:auto}
.modal .box{background:var(--card);border:1px solid var(--trait);border-radius:var(--r);
  padding:24px 26px;max-width:620px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal h3{font-size:22px}
.modal .form{flex-wrap:wrap}

footer{margin:56px 40px 0;padding:22px 0 0;border-top:1px solid var(--trait);
  font-size:12.5px;color:var(--pale);max-width:1000px}

/* ————————————————————————— étroit ————————————————————————— */
.burger{display:none;position:fixed;left:13px;top:13px;z-index:40;background:var(--side);color:var(--side-t);
  border:0;border-radius:10px;width:41px;height:41px;cursor:pointer;place-items:center;
  box-shadow:0 3px 14px rgba(0,0,0,.28)}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:29}
.veil.on{display:block}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:30;width:var(--sidew);
    transform:translateX(-100%);transition:transform .24s}
  .side.on{transform:none}
  .burger{display:grid}
  .main{padding-top:58px}
  .pad{padding:0 20px}
  .hero .in{padding:0 20px 22px}
  .hero{height:238px}
  footer{margin:44px 20px 0}
  .blk{grid-template-columns:52px 20px 1fr;gap:9px}
  .blk .cc{grid-column:3;text-align:left;padding-top:0}
  .blk .cc small{text-align:left;display:inline;margin-left:5px}
}
@media print{
  .side,.burger,.tools,.jot,.qadd,.form{display:none}
  .wrap{display:block} .view{display:block!important} .day .dbody{display:block!important}
}
</style>

<script>const DATA={"yen":165.0,"trames":[{"id":"alpes","titre":"Des cascades<br>et des <em>ateliers</em>","court":"Des cascades et des ateliers","resume":"Cinq stations, d'ouest en est, sans jamais revenir sur ses pas.","deck":"Construit sur ce que tu n'as pas encore vu — Kanazawa, Shirakawa-go, la haute montagne — et sur ce qui compte pour tes parents : l'eau et le relief, la table, les mains qui fabriquent.","nuits":18,"trajet":"7 h 35","par_pers":2955,"vols":false,"solo":false,"depart":null,"etapes":[{"id":"kyoto","nom":"Kyoto","kanji":"京都","nuits":5,"j0":1,"j1":6,"meteo":"18–24 °C, sec — avant la saison des pluies","loge":"Machiya ou hôtel vers Karasuma-Oike, à dix minutes à pied du métro","nuitee":98,"signe":"pagode","teinte":"soir","table":["Kaiseki au comptoir, une fois — c'est le repas qui restera","Tofu de Nanzen-ji, obanzai le soir, matcha à Uji","Nishiki pour le déjeuner debout : tamago, anguille, tsukemono"],"resume":"Deux journées en ville, trois en périphérie, une sans rien prévoir."},{"id":"takayama","nom":"Takayama","kanji":"高山","nuits":5,"j0":6,"j1":11,"meteo":"14–22 °C en ville, 8–16 °C à Kamikochi","loge":"Ryokan dans les ruelles de Sanmachi, chambre à trois avec futons","nuitee":145,"signe":"cascade","teinte":"aube","table":["Bœuf de Hida grillé sur feuille de magnolia (hoba-miso)","Mitarashi dango salés aux marchés du matin","Sake de Hida : sept brasseries en ville, dégustation à la louche"],"resume":"Une ville de charpentiers, deux journées de montagne, une de repos."},{"id":"shirakawago","nom":"Shirakawa-go","kanji":"白川郷","nuits":1,"j0":11,"j1":12,"meteo":"12–21 °C, brume le matin sur les rizières","loge":"Une gassho-zukuri qui reçoit des hôtes — demi-pension, futons au sol","nuitee":180,"signe":"gassho","teinte":"aube","table":["Le dîner de la maison : truite de rivière, légumes de montagne, miso au foyer","Doburoku, le saké non filtré du village"],"resume":"La seule étape d'une nuit, et elle se justifie : le village après 16 h."},{"id":"kanazawa","nom":"Kanazawa","kanji":"金沢","nuits":4,"j0":12,"j1":16,"meteo":"16–24 °C, averses possibles","loge":"Hôtel près du marché Omicho, entre la gare et Higashi Chaya","nuitee":80,"signe":"torii","teinte":"jour","table":["Kaisendon au marché Omicho, à 8 h, crabe et crevettes douces","Jibuni — le canard mijoté local, épais et sucré","Feuille d'or sur un thé ou une glace, au moins pour voir"],"resume":"Le cœur artisanal, et la base d'où l'on atteint la haute montagne."},{"id":"tokyo","nom":"Tokyo","kanji":"東京","nuits":3,"j0":16,"j1":19,"meteo":"19–26 °C, lourd en fin de séjour","loge":"Yanaka ou Nezu — le vieux Tokyo, bas et calme, à vingt minutes de tout","nuitee":92,"signe":"tour","teinte":"soir","table":["Tsukiji le matin, debout : oursin, omelette dashi, thé grillé","Un izakaya de Yanaka, sans carte en anglais","Les dépachika en sous-sol pour les cadeaux du retour"],"resume":"Trois nuits pour finir, dans le Tokyo d'avant plutôt qu'à Shinjuku."}],"jours":[{"n":1,"etape":"kyoto","titre":"Arrivée","blocs":[{"h":"06h20","quoi":"Départ Paris CDG","note":"Finnair AY1576. Enregistrement des deux valises la veille en ligne.","cout":0,"kind":"move"},{"h":"14h05","quoi":"Escale à Helsinki","note":"2 h 40 de correspondance — large. Le terminal non-Schengen est petit, la porte est vite trouvée.","cout":0,"kind":"move"},{"h":"16h45","quoi":"Vol Helsinki → Osaka Kansai","note":"13 h 05. Dormir dès le premier service : à l'arrivée il sera 9 h du matin dans votre tête.","cout":0,"kind":"move"},{"h":"09h55","quoi":"Atterrissage au Kansai","note":"Immigration et bagages : compter une heure. Remplir <b>Visit Japan Web</b> dans l'avion fait gagner la file — QR code à présenter.","cout":0,"kind":"move"},{"h":"11h30","quoi":"Haruka jusqu'à Kyoto","note":"75 minutes, direct. Acheter le billet au guichet JR du hall d'arrivée.","cout":3600,"kind":"move"},{"h":"13h00","quoi":"Poser les valises","note":"Le check-in est souvent à 15 h, mais tous les hôtels gardent les bagages. Ressortir tout de suite.","cout":0,"kind":"stay"},{"h":"14h00","quoi":"Marcher au bord du Kamo","note":"Ne rien planifier. Une heure de berge, un café, une supérette pour l'eau et les petits déjeuners. La lumière tient jusqu'à 19 h en mai.","cout":0,"kind":"walk"},{"h":"18h30","quoi":"Premier dîner près de Pontocho","note":"Une ruelle d'un mètre de large entre la rivière et Kawaramachi. Ne pas viser haut ce soir : yakitori, bière, coucher tôt.","cout":2500,"kind":"eat"}],"note":"Le décalage est de 7 h. Se coucher à 21 h coûte trois jours de réveils à 4 h — tenir jusqu'à 22 h."},{"n":2,"etape":"kyoto","titre":"Le Kyoto qu'on croit connaître","blocs":[{"h":"06h30","quoi":"Fushimi Inari, à l'ouverture de fait","note":"Le sanctuaire ne ferme jamais. Entre 6 h et 8 h, les milliers de torii sont à vous ; à 10 h, c'est une file. Deux heures pour monter au sommet et redescendre par les sentiers de derrière.","cout":0,"kind":"walk"},{"h":"09h30","quoi":"Petit déjeuner à Inari","note":"Les échoppes ouvrent avec le premier train. Inari-zushi, thé.","cout":700,"kind":"eat"},{"h":"11h00","quoi":"Kiyomizu-dera et la côte des potiers","note":"Monter par Gojo-zaka plutôt que par Sannenzaka : c'est la rue des ateliers de céramique, et personne ne la prend.","cout":500,"kind":"see"},{"h":"13h00","quoi":"Déjeuner à Nishiki","note":"La halle couverte, quatre cents mètres de comptoirs. On mange debout, on goûte, on ne s'assied pas.","cout":1500,"kind":"eat"},{"h":"15h30","quoi":"Retour à l'hôtel","note":"Sieste assumée. C'est le jour où le décalage frappe le plus fort.","cout":0,"kind":"rest"},{"h":"18h00","quoi":"Gion à la tombée du jour","note":"Hanamikoji et les ruelles de Shirakawa. Regarder les maisons, pas les geiko — les photographier de près est mal vu et désormais interdit dans certaines rues.","cout":0,"kind":"walk"},{"h":"19h30","quoi":"Obanzai","note":"La cuisine domestique de Kyoto, servie en petits plats. Moins cher et plus intéressant qu'un kaiseki de touristes.","cout":3500,"kind":"eat"}],"note":""},{"n":3,"etape":"kyoto","titre":"Nara","blocs":[{"h":"08h15","quoi":"Kintetsu jusqu'à Nara","note":"45 minutes depuis Kyoto, un départ toutes les 30 minutes. La gare Kintetsu est à dix minutes du parc, la gare JR à vingt-cinq.","cout":760,"kind":"move"},{"h":"09h30","quoi":"Todai-ji","note":"Le Bouddha de quinze mètres, sous la plus grande charpente de bois ancienne du monde — et l'actuelle ne fait que les deux tiers de l'originale.","cout":800,"kind":"see"},{"h":"11h00","quoi":"Le parc et les daims","note":"Mille deux cents, en liberté, qui s'inclinent pour un biscuit. Ils mordent aussi les sacs plastique : garder la nourriture hors de vue.","cout":200,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner","note":"Nakatanidou pour le mochi pilé au marteau en public, puis un vrai déjeuner dans Sanjo-dori.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Kasuga-taisha","note":"Trois mille lanternes, de pierre le long de l'allée, de bronze sous les auvents. La forêt qui l'entoure n'a pas été coupée depuis mille ans.","cout":500,"kind":"see"},{"h":"15h30","quoi":"Naramachi","note":"L'ancien quartier marchand, maisons basses et boutiques d'artisans. Beaucoup plus calme que le parc.","cout":0,"kind":"walk"},{"h":"17h30","quoi":"Retour sur Kyoto","note":"","cout":760,"kind":"move"}],"note":""},{"n":4,"etape":"kyoto","titre":"Kurama et Kibune, à pied","blocs":[{"h":"08h40","quoi":"Eizan Line jusqu'à Kurama","note":"30 minutes depuis Demachiyanagi, sur une ligne à voie unique qui monte dans la forêt. Les deux voitures panoramiques valent le coup.","cout":470,"kind":"move"},{"h":"09h30","quoi":"Le sentier de Kurama à Kibune","note":"Deux heures entre deux villages, par un col à 400 m. Racines, marches de pierre, cèdres. Dénivelé modéré mais réel : de bonnes chaussures.","cout":500,"kind":"walk"},{"h":"12h00","quoi":"Déjeuner à Kibune","note":"Dès juin, les restaurants montent des terrasses <i>kawadoko</i> au-dessus de la rivière. En mai, on mange à l'intérieur, au bord de l'eau quand même.","cout":3000,"kind":"eat"},{"h":"14h00","quoi":"Kibune-jinja","note":"L'escalier aux lanternes rouges. Sanctuaire de l'eau, où l'on tire des oracles qui n'apparaissent qu'une fois trempés.","cout":0,"kind":"see"},{"h":"15h30","quoi":"Bain à Kurama Onsen","note":"Un bain extérieur en pleine forêt, à dix minutes du terminus. Le meilleur usage possible de jambes fatiguées.","cout":1000,"kind":"rest"},{"h":"18h00","quoi":"Retour à Kyoto","note":"","cout":470,"kind":"move"}],"note":"Le sentier ferme par forte pluie. Vérifier la météo la veille et intervertir avec le jour 5 si besoin."},{"n":5,"etape":"kyoto","titre":"Thé, puis les mains","blocs":[{"h":"08h30","quoi":"Uji","note":"Vingt minutes en JR. La ville du thé depuis le XIIIᵉ siècle.","cout":240,"kind":"move"},{"h":"09h30","quoi":"Byodo-in","note":"Le pavillon du Phénix, celui des pièces de dix yens. Reconstruit nulle part — c'est l'original de 1053.","cout":700,"kind":"see"},{"h":"11h00","quoi":"Préparer son matcha","note":"Plusieurs maisons de thé font moudre la feuille à la meule de pierre puis fouetter soi-même. Trente minutes, et on comprend la différence de prix.","cout":1500,"kind":"see"},{"h":"12h30","quoi":"Déjeuner soba au thé vert","note":"Spécialité locale, et les boutiques du bord de rivière font de bons bentos.","cout":1200,"kind":"eat"},{"h":"15h00","quoi":"Fureaikan, musée de l'artisanat","note":"Sous le parc Okazaki. <b>Gratuit</b>, et c'est le meilleur endroit du voyage pour voir la laque, la teinture et la feuille d'or expliquées côte à côte, avec des artisans en démonstration.","cout":0,"kind":"see"},{"h":"17h00","quoi":"Nishijin","note":"Le quartier des tisserands. Métiers Jacquard en marche au Nishijin Textile Center, et des ateliers de rue où l'on entend le battement avant de voir la porte.","cout":0,"kind":"see"},{"h":"19h00","quoi":"Kaiseki, le vrai","note":"Le repas à ne pas économiser. Réserver depuis la France, en demandant à l'hôtel de téléphoner. Compter 8 000 à 15 000 ¥ par personne.","cout":10000,"kind":"eat"}],"note":""},{"n":6,"etape":"takayama","titre":"La ligne du Hida","blocs":[{"h":"08h00","quoi":"Vider la chambre","note":"Petit déjeuner à la supérette, valises bouclées.","cout":0,"kind":"stay"},{"h":"09h15","quoi":"Shinkansen jusqu'à Nagoya","note":"35 minutes. Réserver la veille, les Hikari sont pleins le matin.","cout":5900,"kind":"move"},{"h":"10h48","quoi":"Limited express Hida jusqu'à Takayama","note":"2 h 20 en remontant la vallée de la Hida — <b>une des plus belles lignes du pays</b>. Se placer côté droit en montant : la rivière y est presque tout du long. Bento acheté à Nagoya.","cout":6300,"kind":"move"},{"h":"13h10","quoi":"Arrivée, dépose des valises","note":"Le ryokan est à dix minutes à pied de la gare.","cout":0,"kind":"stay"},{"h":"14h30","quoi":"Sanmachi","note":"Trois rues d'entrepôts et de maisons de marchands d'époque Edo, noircies par le temps. Les brasseries de saké se signalent par une boule de cèdre suspendue au-dessus de la porte — verte quand le nouveau saké est prêt, brune ensuite.","cout":0,"kind":"walk"},{"h":"18h00","quoi":"Premier hoba-miso","note":"Du miso, des champignons et du bœuf de Hida grillés sur une feuille de magnolia, sur un réchaud individuel. Le plat de la ville.","cout":3000,"kind":"eat"}],"note":""},{"n":7,"etape":"takayama","titre":"Kamikochi","blocs":[{"h":"06h50","quoi":"Premier bus pour Hirayu","note":"Depuis la gare routière, à côté de la gare. Un aller-retour se prend au guichet.","cout":2200,"kind":"move"},{"h":"08h20","quoi":"Correspondance pour Kamikochi","note":"Les voitures privées sont interdites dans la vallée depuis 1975 — d'où le changement à Hirayu.","cout":1400,"kind":"move"},{"h":"09h00","quoi":"Le pont Kappa et l'Azusa","note":"La rivière est d'un turquoise laiteux, laissé par la roche broyée. En face, les Hotaka à 3 190 m, souvent encore blancs en mai.","cout":0,"kind":"see"},{"h":"09h30","quoi":"Vers l'étang Taisho, puis Myojin","note":"Trois heures de sentier <b>plat</b>, en boucle, le long de l'eau. C'est la marche que tes parents feront sans difficulté — et la plus belle du voyage.","cout":0,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner à Myojin","note":"Le petit refuge au bord de l'étang. Simple, chaud, et la terrasse donne sur le miroir d'eau.","cout":1200,"kind":"eat"},{"h":"14h00","quoi":"Option : Dakesawa","note":"Pour les jambes qui en veulent, 600 m de dénivelé en deux heures vers un cirque glaciaire. Redescendre avant 16 h.","cout":0,"kind":"walk"},{"h":"16h30","quoi":"Dernier bus","note":"Ne pas le manquer — il n'y a rien après. Vérifier l'horaire du jour au guichet le matin.","cout":3600,"kind":"move"},{"h":"18h30","quoi":"Bain, puis dîner au ryokan","note":"","cout":0,"kind":"rest"}],"note":"Kamikochi est fermé de mi-novembre à mi-avril. En mai, prévoir une polaire : il fait dix degrés de moins qu'en ville."},{"n":8,"etape":"takayama","titre":"Comment on vivait ici","blocs":[{"h":"07h00","quoi":"Marchés du matin","note":"Deux, tous les jours : Miyagawa le long de la rivière, Jinya-mae devant l'ancien bureau du gouvernement. Légumes de montagne, cornichons, dango salés grillés.","cout":500,"kind":"walk"},{"h":"09h00","quoi":"Takayama Jinya","note":"<b>Le seul bureau de gouvernement d'époque Edo encore debout au Japon.</b> Salles d'audience, greniers à riz de l'impôt, et une salle d'interrogatoire où les instruments sont exposés sans commentaire.","cout":440,"kind":"see"},{"h":"11h00","quoi":"Bus pour Hida no Sato","note":"Dix minutes.","cout":260,"kind":"move"},{"h":"11h20","quoi":"Hida no Sato","note":"Une trentaine de fermes démontées dans les vallées voisines et remontées autour d'un étang. On entre, on voit les foyers noircis, les greniers à vers à soie, les outils. Compter deux bonnes heures.","cout":700,"kind":"see"},{"h":"13h30","quoi":"Déjeuner sur place","note":"Soba de sarrasin de montagne, à la cabane du village.","cout":1000,"kind":"eat"},{"h":"15h30","quoi":"Sculpture sur if","note":"L'<i>ichii ittobori</i> se taille d'un seul couteau, sans peinture, en jouant sur les deux teintes du bois de l'if. Ateliers ouverts dans les ruelles de Sanmachi.","cout":0,"kind":"see"},{"h":"18h30","quoi":"Bœuf de Hida","note":"Moins connu que celui de Kobe, souvent meilleur, et deux fois moins cher ici qu'à Tokyo. Un restaurant de la vieille ville, réservé le matin même.","cout":6000,"kind":"eat"}],"note":""},{"n":9,"etape":"takayama","titre":"Eau chaude et cascade","blocs":[{"h":"08h30","quoi":"Bus vers Hirayu","note":"Sur la route de Kamikochi.","cout":1600,"kind":"move"},{"h":"09h40","quoi":"Hirayu Otaki","note":"Une chute de 64 m qu'on approche à quelques mètres. En mai, elle est au débit de la fonte — on la sent avant de la voir.","cout":0,"kind":"see"},{"h":"11h00","quoi":"Les bains de Hirayu","note":"Une dizaine de sources, dont plusieurs bains extérieurs en forêt. Le plus grand, Hirayu no Mori, a seize bassins et accepte les visiteurs à la journée.","cout":700,"kind":"rest"},{"h":"13h30","quoi":"Déjeuner au village","note":"","cout":1200,"kind":"eat"},{"h":"16h00","quoi":"Retour à Takayama","note":"","cout":1600,"kind":"move"},{"h":"17h30","quoi":"Rien","note":"Une fin d'après-midi sans programme, au milieu du voyage. C'est délibéré.","cout":0,"kind":"rest"}],"note":"Journée de récupération, placée entre deux marches. La déplacer selon la météo — c'est le jour le plus souple de la trame."},{"n":10,"etape":"takayama","titre":"Furukawa","blocs":[{"h":"09h00","quoi":"Train pour Hida-Furukawa","note":"Quinze minutes vers le nord. Les cars ne s'y arrêtent pas.","cout":240,"kind":"move"},{"h":"09h30","quoi":"Les canaux du Seto","note":"Un village de charpentiers, comme Takayama mais sans la foule : des canaux à carpes le long des entrepôts blancs. On en fait le tour en une heure, lentement.","cout":0,"kind":"walk"},{"h":"11h00","quoi":"Musée des charpentiers","note":"Les assemblages du Japon en bois, à taille réelle, qu'on peut manipuler. Aucun clou nulle part.","cout":500,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Furukawa","note":"","cout":1200,"kind":"eat"},{"h":"15h00","quoi":"Retour, et les brasseries","note":"Sept maisons de saké à Takayama, la plupart ouvertes à la dégustation pour deux ou trois cents yens le verre. Le riz de Hida et l'eau de fonte donnent des sakés secs.","cout":800,"kind":"eat"},{"h":"17h00","quoi":"Acheter, si on achète","note":"C'est ici qu'on trouve la sculpture sur if et la laque de Hida. Les ateliers expédient en France.","cout":0,"kind":"see"}],"note":""},{"n":11,"etape":"shirakawago","titre":"Le village après les cars","blocs":[{"h":"08h30","quoi":"Laisser les grosses valises","note":"Consigne à la gare de Takayama, ou le ryokan les garde. Monter avec un sac pour une nuit — la gassho n'a pas d'ascenseur et les futons sont au sol.","cout":600,"kind":"stay"},{"h":"10h50","quoi":"Bus Nohi pour Shirakawa-go","note":"50 minutes. <b>Réserver le siège</b> : le bus est souvent complet en saison.","cout":2600,"kind":"move"},{"h":"12h00","quoi":"Déjeuner au village","note":"Truite grillée à la broche, soba, et le doburoku si l'occasion se présente.","cout":1500,"kind":"eat"},{"h":"13h30","quoi":"Wada-ke","note":"La maison du chef de village, la plus grande ouverte à la visite. Monter dans les combles voir la charpente et les claies d'élevage des vers à soie.","cout":400,"kind":"see"},{"h":"15h00","quoi":"Le Minkaen, sur l'autre rive","note":"Vingt-cinq maisons remontées, un musée de plein air nettement moins fréquenté que le village lui-même. Démonstrations de réfection de toiture certains jours.","cout":600,"kind":"see"},{"h":"16h30","quoi":"Les cars repartent","note":"C'est l'heure qui justifie la nuit sur place. Entre 16 h et 10 h le lendemain, le village redevient un village.","cout":0,"kind":"note"},{"h":"17h30","quoi":"Shiroyama au crépuscule","note":"Vingt minutes de montée jusqu'au belvédère. En mai-juin, les rizières en eau doublent le village en reflet, et la lumière rasante de 18 h vaut toutes les photos de midi.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Dîner au foyer","note":"La demi-pension est la règle. Truite de rivière plantée autour du foyer central, légumes de montagne, miso. On mange avec les autres hôtes.","cout":0,"kind":"eat"}],"note":"Premier hébergement à réserver du voyage — six mois à l'avance, avant même le vol."},{"n":12,"etape":"kanazawa","titre":"Vers l'or","blocs":[{"h":"06h30","quoi":"Le village vide","note":"Se lever tôt une dernière fois. La brume monte des rizières, il n'y a personne, et c'est pour cette heure-là qu'on a dormi ici.","cout":0,"kind":"walk"},{"h":"08h00","quoi":"Petit déjeuner à la maison","note":"Riz, poisson grillé, œuf, soupe. Comme le dîner, autour du foyer.","cout":0,"kind":"eat"},{"h":"10h45","quoi":"Bus Hokutetsu pour Kanazawa","note":"1 h 15. Réserver aussi celui-ci.","cout":2600,"kind":"move"},{"h":"12h15","quoi":"Arrivée et dépose","note":"L'hôtel est près d'Omicho, entre la gare et la vieille ville.","cout":0,"kind":"stay"},{"h":"14h00","quoi":"Higashi Chaya","note":"Le quartier des maisons de thé, aux façades de lattes de bois. Deux maisons se visitent à l'intérieur — Shima et Kaikaro — avec leurs salons à l'étage et la feuille d'or aux murs.","cout":750,"kind":"see"},{"h":"16h00","quoi":"Poser la feuille d'or soi-même","note":"Plusieurs ateliers font décorer une boîte ou des baguettes. La feuille fait un dixième de micron : elle se déchire au moindre souffle, ce qui est tout l'intérêt.","cout":1500,"kind":"see"},{"h":"19h00","quoi":"Jibuni","note":"Le canard mijoté de Kanazawa, lié à la fécule, avec du wasabi frais. Épais, sucré, très différent du reste du voyage.","cout":3000,"kind":"eat"}],"note":""},{"n":13,"etape":"kanazawa","titre":"La route alpine","blocs":[{"h":"07h30","quoi":"Shinkansen jusqu'à Toyama","note":"23 minutes.","cout":3000,"kind":"move"},{"h":"08h30","quoi":"Toyama → Murodo","note":"Train de montagne, funiculaire, puis car à travers le plateau. Trois correspondances, deux heures, et on passe de 200 à 2 450 m.","cout":9500,"kind":"move"},{"h":"11h00","quoi":"Le mur de neige","note":"Un corridor taillé dans une congère de dix à quinze mètres, ouvert à la marche sur cinq cents mètres. Il tient jusqu'à mi-juin, en fondant.","cout":0,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner à Murodo","note":"Le restaurant de la station. Il n'y a rien d'autre là-haut, et c'est très bien ainsi.","cout":1500,"kind":"eat"},{"h":"13h30","quoi":"L'étang Mikuri","note":"Une heure de tour, sur la neige en mai. Les crampons légers se louent sur place. Par temps clair, le Tateyama entier se reflète dedans.","cout":0,"kind":"walk"},{"h":"15h00","quoi":"Redescente","note":"Par le même chemin, ou en traversée jusqu'au barrage de Kurobe si le temps le permet — mais alors on ne revient pas à Toyama le soir.","cout":0,"kind":"move"},{"h":"18h30","quoi":"Retour à Kanazawa","note":"","cout":3000,"kind":"move"}],"note":"Compter environ 90 € par personne pour la journée. La route ouvre mi-avril et ferme fin novembre — vérifier l'état d'ouverture, la neige décide."},{"n":14,"etape":"kanazawa","titre":"Le marché, le jardin, les samouraïs","blocs":[{"h":"07h00","quoi":"Kenrokuen avant l'heure","note":"<b>L'entrée est gratuite avant 7 h</b> (8 h l'hiver), et les allées sont vides. Un des trois grands jardins du Japon, dessiné sur deux siècles.","cout":0,"kind":"walk"},{"h":"08h30","quoi":"Marché Omicho","note":"Trois cents ans de halle. Crabe des neiges, crevettes douces, oursins de la mer du Japon. Prendre un kaisendon — un bol de riz couvert de sashimi — au comptoir, pour le petit déjeuner.","cout":2500,"kind":"eat"},{"h":"10h30","quoi":"Nagamachi","note":"Le quartier des samouraïs, avec ses murs de terre protégés l'hiver par des nattes de paille. La maison Nomura se visite, jardin compris.","cout":550,"kind":"see"},{"h":"13h00","quoi":"Musée du XXIᵉ siècle","note":"Un disque de verre posé dans la ville, sans façade ni entrée principale. La piscine de Leandro Erlich s'y regarde par en dessous. Réserver le créneau en ligne.","cout":1200,"kind":"see"},{"h":"15h30","quoi":"Musée de la feuille d'or","note":"<b>99 % de la feuille d'or japonaise vient d'ici.</b> Le musée Yasue montre le battage : quatre heures pour amener un gramme à un mètre carré.","cout":310,"kind":"see"},{"h":"18h30","quoi":"Comptoir de sushi","note":"Kanazawa se dispute Kanazawa le meilleur poisson du pays. Un omakase de quartier, pas un comptoir à touristes.","cout":6000,"kind":"eat"}],"note":""},{"n":15,"etape":"kanazawa","titre":"La côte de Noto","blocs":[{"h":"08h30","quoi":"Prendre la voiture","note":"Agence près de la gare. Environ 70 € la journée pour le groupe, plus l'essence. <b>Le permis international est obligatoire</b> — à demander en préfecture avant de partir, c'est gratuit et ça prend quelques semaines.","cout":0,"kind":"move"},{"h":"10h30","quoi":"Senmaida","note":"Mille rizières en terrasses qui dévalent jusqu'à la mer. En mai elles sont en eau, donc en miroir. Un sentier descend entre elles jusqu'aux rochers.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Wajima","note":"Poisson du port, dans une ville qui se relève encore du séisme de 2024. Y déjeuner est utile autant qu'agréable.","cout":1800,"kind":"eat"},{"h":"14h00","quoi":"La laque de Wajima","note":"Cent couches, chacune poncée. Le musée montre les étapes, et plusieurs ateliers de la ville laissent entrer.","cout":630,"kind":"see"},{"h":"16h00","quoi":"La route côtière du retour","note":"Par la côte ouest, avec les falaises et les rochers de Ganmon. Deux heures jusqu'à Kanazawa.","cout":0,"kind":"move"}],"note":"Sans voiture : remplacer par le Myoryu-ji (le temple aux pièges, visite guidée sur réservation) et le musée D.T. Suzuki, deux salles et un bassin, le lieu le plus calme de la ville."},{"n":16,"etape":"tokyo","titre":"Traversée","blocs":[{"h":"09h00","quoi":"Kagayaki jusqu'à Tokyo","note":"2 h 30, direct, sans changement. Réserver la veille — c'est un train très emprunté. Côté  sur Tokyo","note":"","cout":430,"kind":"move"}],"note":"À faire en semaine : le mont Takao est la montagne du dimanche des Tokyoïtes, et le week-end le sentier principal se fait à la queue leu leu."},{"n":18,"etape":"tokyo","titre":"Maisons et couteaux","blocs":[{"h":"09h00","quoi":"Musée en plein air de l'architecture Edo-Tokyo","note":"À Koganei, quarante minutes. Trente maisons et boutiques sauvées de la démolition et remontées : bains publics, taverne, échoppe de teinturier, villa moderniste des années 1940. Le pendant urbain de Hida no Sato, et presque personne n'y va.","cout":400,"kind":"see"},{"h":"13h00","quoi":"Déjeuner sur place","note":"Le parc de Koganei autour, si le temps s'y prête.","cout":1000,"kind":"eat"},{"h":"15h00","quoi":"Kappabashi","note":"La rue des fournisseurs de restaurants, entre Ueno et Asakusa. Couteaux forgés, moules à pâtisserie, vaisselle au kilo, et les répliques de plats en résine. C'est là qu'on achète un couteau qui durera trente ans, gravé à son nom devant soi.","cout":0,"kind":"see"},{"h":"17h30","quoi":"Senso-ji en fin de journée","note":"À dix minutes à pied. La grande lanterne, et Nakamise vidée de ses cars.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Dernier vrai dîner","note":"Le repas où l'on dépense sans compter, puisque c'est le dernier.","cout":6000,"kind":"eat"}],"note":""},{"n":19,"etape":"tokyo","titre":"Retour","blocs":[{"h":"07h00","quoi":"Tsukiji, le marché extérieur","note":"Le marché aux poissons a déménagé à Toyosu, mais les échoppes de rue sont restées. Oursin, omelette dashi, thé grillé, debout, à sept heures du matin.","cout":2000,"kind":"eat"},{"h":"10h00","quoi":"Dépachika","note":"Les sous-sols alimentaires des grands magasins de Ginza. C'est là qu'on prend les cadeaux : thés, sucreries, sauces, emballés comme des bijoux.","cout":0,"kind":"see"},{"h":"13h00","quoi":"Récupérer les valises","note":"L'hôtel les garde après le check-out. Prévoir large : la pesée compte, avec deux fois 23 kg.","cout":0,"k note":"Le décalage est de 7 h. Se coucher à 21 h coûte trois jours de réveils à 4 h — tenir jusqu'à 22 h."},{"n":2,"etape":"kyoto","titre":"Le Kyoto qu'on croit connaître","blocs":[{"h":"06h30","quoi":"Fushimi Inari, à l'ouverture de fait","note":"Le sanctuaire ne ferme jamais. Entre 6 h et 8 h, les milliers de torii sont à vous ; à 10 h, c'est une file. Deux heures pour monter au sommet et redescendre par les sentiers de derrière.","cout":0,"kind":"walk"},{"h":"09h30","quoi":"Petit déjeuner à Inari","note":"Les échoppes ouvrent avec le premier train. Inari-zushi, thé.","cout":700,"kind":"eat"},{"h":"11h00","quoi":"Kiyomizu-dera et la côte des potiers","note":"Monter par Gojo-zaka plutôt que par Sannenzaka : c'est la rue des ateliers de céramique, et personne ne la prend.","cout":500,"kind":"see"},{"h":"13h00","quoi":"Déjeuner à Nishiki","note":"La halle couverte, quatre cents mètres de comptoirs. On mange debout, on goûte, on ne s'assied pas.","cout":1500,"kind":"eat"},{"h":"15h30","quoi":"Retour à l'hôtel","note":"Sieste assumée. C'est le jour où le décalage frappe le plus fort.","cout":0,"kind":"rest"},{"h":"18h00","quoi":"Gion à la tombée du jour","note":"Hanamikoji et les ruelles de Shirakawa. Regarder les maisons, pas les geiko — les photographier de près est mal vu et désormais interdit dans certaines rues.","cout":0,"kind":"walk"},{"h":"19h30","quoi":"Obanzai","note":"La cuisine domestique de Kyoto, servie en petits plats. Moins cher et plus intéressant qu'un kaiseki de touristes.","cout":3500,"kind":"eat"}],"note":""},{"n":3,"etape":"kyoto","titre":"Nara","blocs":[{"h":"08h15","quoi":"Kintetsu jusqu'à Nara","note":"45 minutes depuis Kyoto, un départ toutes les 30 minutes. La gare Kintetsu est à dix minutes du parc, la gare JR à vingt-cinq.","cout":760,"kind":"move"},{"h":"09h30","quoi":"Todai-ji","note":"Le Bouddha de quinze mètres, sous la plus grande charpente de bois ancienne du monde — et l'actuelle ne fait que les deux tiers de l'originale.","cout":800,"kind":"see"},{"h":"11h00","quoi":"Le parc et les daims","note":"Mille deux cents, en liberté, qui s'inclinent pour un biscuit. Ils mordent aussi les sacs plastique : garder la nourriture hors de vue.","cout":200,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner","note":"Nakatanidou pour le mochi pilé au marteau en public, puis un vrai déjeuner dans Sanjo-dori.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Kasuga-taisha","note":"Trois mille lanternes, de pierre le long de l'allée, de bronze sous les auvents. La forêt qui l'entoure n'a pas été coupée depuis mille ans.","cout":500,"kind":"see"},{"h":"15h30","quoi":"Naramachi","note":"L'ancien quartier marchand, maisons basses et boutiques d'artisans. Beaucoup plus calme que le parc.","cout":0,"kind":"walk"},{"h":"17h30","quoi":"Retour sur Kyoto","note":"","cout":760,"kind":"move"}],"note":""},{"n":4,"etape":"kyoto","titre":"Thé, puis les mains","blocs":[{"h":"08h30","quoi":"Uji","note":"Vingt minutes en JR. La ville du thé depuis le XIIIᵉ siècle.","cout":240,"kind":"move"},{"h":"09h30","quoi":"Byodo-in","note":"Le pavillon du Phénix, celui des pièces de dix yens. Reconstruit nulle part — c'est l'original de 1053.","cout":700,"kind":"see"},{"h":"11h00","quoi":"Préparer son matcha","note":"Plusieurs maisons de thé font moudre la feuille à la meule de pierre puis fouetter soi-même. Trente minutes, et on comprend la différence de prix.","cout":1500,"kind":"see"},{"h":"12h30","quoi":"Déjeuner soba au thé vert","note":"Spécialité locale, et les boutiques du bord de rivière font de bons bentos.","cout":1200,"kind":"eat"},{"h":"15h00","quoi":"Fureaikan, musée de l'artisanat","note":"Sous le parc Okazaki. <b>Gratuit</b>, et c'est le meilleur endroit du voyage pour voir la laque, la teinture et la feuille d'or expliquées côte à côte, avec des artisans en démonstration.","cout":0,"kind":"see"},{"h":"17h00","quoi":"Nishijin","note":"Le quartier des tisserands. Métiers Jacquard en marche au Nishijin Textile Center, et des ateliers de rue où l'on entend le battement avant de voir la porte.","cout":0,"kind":"see"},{"h":"19h00","quoi":"Kaiseki, le vrai","note":"Le repas à ne pas économiser. Réserver depuis la France, en demandant à l'hôtel de téléphoner. Compter 8 000 à 15 000 ¥ par personne.","cout":10000,"kind":"eat"}],"note":""},{"n":5,"etape":"fukuoka","titre":"Descendre vers le sud","blocs":[{"h":"08h30","quoi":"Vider la chambre","note":"","cout":0,"kind":"stay"},{"h":"09h47","quoi":"Shinkansen Sakura jusqu'à Hakata","note":"3 h via Shin-Osaka. Les Sakura ont des sièges en 2+2 au lieu de 2+3 — plus larges, même prix. Bento acheté à Kyoto.","cout":12200,"kind":"move"},{"h":"12h50","quoi":"Arrivée à Hakata","note":"La gare est une ville : dix étages de boutiques et de restaurants au-dessus des quais.","cout":0,"kind":"stay"},{"h":"14h30","quoi":"Kushida-jinja","note":"Le sanctuaire de la ville, où l'on garde toute l'année un char de festival de dix mètres — ceux que des équipes de quartier portent en courant chaque juillet.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Le parc Ohori","note":"Un ancien fossé de château devenu lac, avec des îlots reliés par des ponts. Le tour fait deux kilomètres, à plat, et c'est là que la ville se promène.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Premiers yatai","note":"Cent trente baraques montées chaque soir sur les trottoirs de Nakasu et Tenjin, démontées à l'aube. Huit tabourets, un rideau, du ramen et du oden. <b>C'est la spécialité de Fukuoka, et elle n'existe plus qu'ici.</b>","cout":2500,"kind":"eat"}],"note":"Fukuoka est la ville la moins chère du voyage, et la mieux placée : Arita, Nagasaki et Kumamoto sont toutes à moins de deux heures."},{"n":6,"etape":"fukuoka","titre":"Arita et Imari","blocs":[{"h":"08h20","quoi":"Limited express jusqu'à Arita","note":"1 h 20 vers l'ouest, à travers les collines de Saga.","cout":2800,"kind":"move"},{"h":"09h45","quoi":"Arita, la ville de la porcelaine","note":"<b>La première porcelaine du Japon y a été cuite en 1616</b>, par des potiers coréens amenés de force après les campagnes de Hideyoshi. La ville n'a jamais fait autre chose depuis.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le musée Kyushu Ceramic","note":"Quatre siècles de production, dont la collection Shibata — dix mille pièces d'Imari d'exportation. Gratuit.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Arita","note":"Servi dans de la porcelaine locale, forcément.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Le quartier des fours","note":"Uchiyama, une rue de kilns et d'ateliers, avec les murs de tessons — les rebuts de quatre siècles, encastrés dans les clôtures.","cout":0,"kind":"walk"},{"h":"15h30","quoi":"Peindre une pièce","note":"Plusieurs ateliers font décorer une tasse au pinceau, cuite ensuite et expédiée. Compter un mois pour la recevoir.","cout":2500,"kind":"see"},{"h":"17h00","quoi":"Retour sur Fukuoka","note":"","cout":2800,"kind":"move"}],"note":""},{"n":7,"etape":"fukuoka","titre":"Dazaifu","blocs":[{"h":"09h00","quoi":"Nishitetsu jusqu'à Dazaifu","note":"45 minutes depuis Tenjin. Certaines rames sont décorées par un designer de trains célèbre.","cout":420,"kind":"move"},{"h":"10h00","quoi":"Tenman-gu","note":"Le sanctuaire des études, où viennent les lycéens avant les examens. Six mille pruniers, et un bœuf de bronze qu'on frotte à la tête.","cout":0,"kind":"see"},{"h":"11h30","quoi":"Komyozen-ji","note":"À deux minutes, et presque personne : un jardin de mousse et de pierres qu'on regarde assis sur la véranda de bois. Deux cents yens dans une boîte.","cout":200,"kind":"rest"},{"h":"12h30","quoi":"Déjeuner","note":"Umegae-mochi, la galette de riz grillée fourrée de haricot rouge, vendue tout le long de l'allée.","cout":1200,"kind":"eat"},{"h":"14h00","quoi":"Musée national de Kyushu","note":"Un des quatre musées nationaux du pays, dans un bâtiment de verre courbe adossé à la colline. Il raconte le Japon par ses échanges avec le continent — ce qui est tout le sujet de cet itinéraire.","cout":700,"kind":"see"},{"h":"17h00","quoi":"Retour","note":"","cout":420,"kind":"move"}],"note":""},{"n":8,"etape":"fukuoka","titre":"Les barques de Yanagawa","blocs":[{"h":"09h00","quoi":"Nishitetsu jusqu'à Yanagawa","note":"50 minutes vers le sud.","cout":870,"kind":"move"},{"h":"10h15","quoi":"Descendre les canaux en barque","note":"Quatre cents ans de douves transformées en canaux, parcourus à la perche sur des barques à fond plat. Une heure au fil de l'eau, sous les saules et les ponts bas — le batelier chante, et il faut se baisser.","cout":1900,"kind":"walk"},{"h":"12h00","quoi":"Unagi no seiromushi","note":"L'anguille de Yanagawa, cuite à la vapeur sur son riz dans un panier laqué. C'est <b>le</b> plat de la ville, et il vaut le détour à lui seul.","cout":3500,"kind":"eat"},{"h":"14h00","quoi":"La résidence Ohana","note":"Une maison de daimyo avec son jardin de pins et sa salle occidentale de 1910, curieux mélange.","cout":700,"kind":"see"},{"h":"16h30","quoi":"Retour sur Fukuoka","note":"","cout":870,"kind":"move"}],"note":"Variante : Mojiko et Shimonoseki, à une heure — un port rétro de brique rouge, le détroit et son tunnel piéton sous la mer."},{"n":9,"etape":"fukuoka","titre":"La ville, sans rien forcer","blocs":[{"h":"09h30","quoi":"Le musée d'Asie de Fukuoka","note":"Le seul musée au monde consacré à l'art contemporain de toute l'Asie. Petit, très bien fait.","cout":200,"kind":"see"},{"h":"11h30","quoi":"Shofuku-ji","note":"<b>Le premier temple zen du Japon</b>, fondé en 1195 par le moine qui a rapporté le thé de Chine. On y entre librement, il n'y a rien à payer et presque personne.","cout":0,"kind":"see"},{"h":"13h00","quoi":"Ramen au comptoir","note":"Le tonkotsu est né ici : un bouillon d'os de porc bouilli douze heures jusqu'à devenir blanc. On commande la fermeté des nouilles, et on peut redemander une portion sèche — <i>kaedama</i>.","cout":900,"kind":"eat"},{"h":"15h00","quoi":"Faire ses courses à Tenjin","note":"Les grands magasins, les sous-sols alimentaires, et les rues couvertes autour de Daimyo pour les petites boutiques.","cout":0,"kind":"see"},{"h":"18h30","quoi":"Dernier yatai","note":"Choisir une baraque avec des habitués plutôt qu'une carte en anglais.","cout":2500,"kind":"eat"}],"note":""},{"n":10,"etape":"nagasaki","titre":"La fenêtre du Japon fermé","blocs":[{"h":"09h30","quoi":"Kamome et Shinkansen Nishi-Kyushu","note":"1 h 30 avec un changement à Takeo-Onsen. La ligne à grande vitesse est ouverte depuis 2022 et ne va nulle part ailleurs.","cout":6600,"kind":"move"},{"h":"11h10","quoi":"Arrivée, dépose des valises","note":"La ville tient dans une baie étroite : tout se fait à pied ou en tramway, à 140 ¥ le trajet.","cout":0,"kind":"stay"},{"h":"13h30","quoi":"Dejima","note":"<b>Pendant deux cent dix ans, cet îlot en éventail a été le seul point de contact entre le Japon et l'Occident.</b> Les Hollandais y étaient consignés, et tout ce qui est entré de science européenne est passé par là. Une quinzaine de bâtiments ont été reconstruits à l'identique.","cout":520,"kind":"see"},{"h":"16h00","quoi":"Le quartier chinois et le pont aux lunettes","note":"Shinchi, un des trois quartiers chinois du Japon. Le Megane-bashi, de 1634, se reflète en deux cercles quand la rivière est calme.","cout":0,"kind":"walk"},{"h":"19h00","quoi":"Champon","note":"Nouilles épaisses, porc, fruits de mer et légumes dans un bouillon blanc — inventé ici pour nourrir les étudiants chinois pauvres.","cout":1200,"kind":"eat"}],"note":""},{"n":11,"etape":"nagasaki","titre":"Ce qui s'est passé ici","blocs":[{"h":"09h00","quoi":"Musée de la bombe atomique","note":"Le 9 août 1945 à 11 h 02. Le musée est chronologique, factuel et très dur — surtout la salle des objets. Prévoir de ne rien faire de lourd après.","cout":200,"kind":"see"},{"h":"11h00","quoi":"L'hypocentre et le parc de la Paix","note":"Une colonne noire marque le point exact, à cinq cents mètres au-dessus duquel la bombe a explosé. Autour, les pans de la cathédrale Urakami laissés en place.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Déjeuner tranquille","note":"","cout":1200,"kind":"eat"},{"h":"14h30","quoi":"Le sanctuaire au torii d'une jambe","note":"Sanno-jinja : le souffle en a emporté la moitié, et il tient debout ainsi depuis. À côté, deux camphriers calcinés qui ont refeuillé l'année suivante.","cout":0,"kind":"see"},{"h":"16h00","quoi":"Une fin d'après-midi vide","note":"Volontairement. Un café, la chambre, la baie.","cout":0,"kind":"rest"}],"note":"La journée la plus lourde du voyage. Elle est placée en début d'étape pour ne pas finir dessus."},{"n":12,"etape":"nagasaki","titre":"Gunkanjima","blocs":[{"h":"09h00","quoi":"Bateau pour Hashima","note":"Une île de deux cents mètres sur quatre cents, couverte d'immeubles de béton vides — <b>la plus forte densité humaine jamais atteinte</b> quand cinq mille mineurs y vivaient. Fermée en 1974, abandonnée telle quelle.","cout":4500,"kind":"move"},{"h":"10h30","quoi":"Débarquement","note":"On ne visite qu'un couloir sécurisé au sud, le reste s'écroule. La sortie est annulée si la houle dépasse 50 cm — <b>compter un jour de repli</b>.","cout":310,"kind":"see"},{"h":"13h00","quoi":"Déjeuner au retour","note":"Sur le port.","cout":1500,"kind":"eat"},{"h":"15h00","quoi":"Glover Garden","note":"Les maisons des marchands occidentaux du XIXᵉ, sur la pente, avec vue sur la baie. Celle de Glover est la plus ancienne maison de style occidental du Japon.","cout":620,"kind":"see"},{"h":"17h00","quoi":"Oura, et les chrétiens cachés","note":"La plus ancienne église du pays. En 1865, des paysans y ont avoué à un prêtre français que leurs familles pratiquaient en secret depuis <b>sept générations</b>, sans prêtre ni livre.","cout":1000,"kind":"see"},{"h":"20h00","quoi":"Le mont Inasa","note":"Téléphérique jusqu'à 333 m. La baie en fer à cheval, illuminée — une des vues de nuit les plus réputées du pays.","cout":1250,"kind":"see"}],"note":""},{"n":13,"etape":"nagasaki","titre":"Unzen, ou la ville","blocs":[{"h":"08h30","quoi":"Bus pour Unzen","note":"1 h 40 par la péninsule de Shimabara.","cout":1850,"kind":"move"},{"h":"10h30","quoi":"Les Enfers d'Unzen","note":"Des fumerolles en plein village, avec des passerelles entre les évents. C'est là qu'on a exécuté des chrétiens en les ébouillantant au XVIIᵉ — le lieu porte les deux histoires.","cout":0,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner et bain","note":"Les auberges du village ouvrent leurs bains à la journée.","cout":2200,"kind":"rest"},{"h":"15h00","quoi":"Retour sur Nagasaki","note":"","cout":1850,"kind":"move"},{"h":"18h00","quoi":"Shippoku, si l'envie est là","note":"La table sino-portugaise de Nagasaki, servie à partager sur un plateau rond — ce qui, au Japon, ne se fait nulle part ailleurs. Se réserve à trois minimum, donc c'est jouable.","cout":5000,"kind":"eat"}],"note":"Variante si la sortie à Gunkanjima a été annulée la veille : c'est le jour de repli."},{"n":14,"etape":"kumamoto","titre":"Le château qui se relève","blocs":[{"h":"10h00","quoi":"Shinkansen via Fukuoka","note":"1 h 55 avec un changement à Hakata.","cout":9100,"kind":"move"},{"h":"12h30","quoi":"Arrivée, dépose","note":"Le tramway dessert tout depuis la gare.","cout":0,"kind":"stay"},{"h":"14h00","quoi":"Le château","note":"Un des trois grands châteaux du Japon, et ses murs incurvés que l'on disait infranchissables. <b>Le séisme de 2016 en a jeté une partie à terre</b> ; la reconstruction pierre par pierre durera jusqu'en 2052. Une passerelle surélevée traverse le chantier — on voit les murs en cours de remontage, numérotés.","cout":800,"kind":"see"},{"h":"16h30","quoi":"Le jardin Suizenji","note":"Un parcours du Tokaido miniature : chaque butte est une étape de la route, dont un mont Fuji en gazon. Dessiné au XVIIᵉ autour d'une source.","cout":400,"kind":"walk"},{"h":"19h00","quoi":"Karashi renkon","note":"Racine de lotus fourrée à la moutarde puis frite. Et le basashi pour qui veut essayer — Kumamoto en est la capitale.","cout":3000,"kind":"eat"}],"note":""},{"n":15,"etape":"kumamoto","titre":"L'Aso","blocs":[{"h":"08h00","quoi":"Train pour Aso","note":"1 h 20 par la ligne de Hohi, qui monte dans la caldeira.","cout":1130,"kind":"move"},{"h":"09h30","quoi":"Entrer dans le cirque","note":"<b>Le plus grand cirque volcanique du monde</b> : 25 km sur 18, avec quarante mille personnes qui vivent dedans, des villages, des routes et des rizières. Le rebord se voit de partout.","cout":0,"kind":"see"},{"h":"10h30","quoi":"Le Nakadake","note":"Le cratère actif, fumant, qu'on approche en car jusqu'au bord. <b>L'accès ferme sans préavis</b> selon les gaz — vérifier le matin même sur le site du parc.","cout":1200,"kind":"see"},{"h":"12h30","quoi":"Déjeuner à Kusasenri","note":"La prairie d'altitude, avec des chevaux en liberté et un ancien cratère devenu étang.","cout":1400,"kind":"eat"},{"h":"14h00","quoi":"Le Komezuka","note":"Une colline conique parfaite, un cône de scories de cent mètres, avec une entaille au sommet — la légende dit qu'un dieu y a puisé du riz pour les affamés.","cout":0,"kind":"walk"},{"h":"16h00","quoi":"Retour","note":"","cout":1130,"kind":"move"}],"note":"Alternative si le cratère est fermé : Takachiho et ses gorges, où l'on descend une barque entre des orgues basaltiques sous une cascade. Trois heures de route, donc journée pleine."},{"n":16,"etape":"kumamoto","titre":"Kurokawa","blocs":[{"h":"09h00","quoi":"Bus pour Kurokawa Onsen","note":"2 h 30 à travers l'Aso. Un village thermal qui a refusé les néons et les grands hôtels : bois, pierre, lanternes, et une rivière au milieu.","cout":3000,"kind":"move"},{"h":"12h00","quoi":"Le passeport des bains","note":"Un jeton de bois donne accès à <b>trois bains extérieurs au choix</b> parmi vingt-quatre, répartis dans les auberges du village. On circule en yukata d'un bain à l'autre.","cout":1500,"kind":"rest"},{"h":"13h30","quoi":"Déjeuner au village","note":"","cout":1800,"kind":"eat"},{"h":"17h00","quoi":"Retour à Kumamoto","note":"","cout":3000,"kind":"move"},{"h":"19h30","quoi":"Dernier dîner","note":"","cout":4000,"kind":"eat"}],"note":""},{"n":17,"etape":"kumamoto","titre":"Retour par Fukuoka","blocs":[{"h":"08h00","quoi":"Petit déjeuner et valises","note":"","cout":0,"kind":"stay"},{"h":"09h30","quoi":"Shinkansen Sakura jusqu'à Hakata","note":"35 minutes. <b>Repartir de Fukuoka plutôt que de remonter sur Tokyo économise une journée entière et environ 130 € par personne.</b>","cout":5800,"kind":"move"},{"h":"10h15","quoi":"Deux heures à Hakata","note":"Les sous-sols alimentaires de la gare pour les cadeaux : mentaiko sous vide, gâteaux de Kyushu.","cout":0,"kind":"see"},{"h":"12h30","quoi":"Métro jusqu'à l'aéroport","note":"<b>Onze minutes depuis la gare de Hakata</b> — Fukuoka a l'aéroport le mieux placé du pays.","cout":260,"kind":"move"},{"h":"15h30","quoi":"Vol Fukuoka → Paris","note":"Avec escale. Compter 20 h de porte à porte.","cout":0,"kind":"move"}],"note":""}],"resa":[{"quoi":"Le vol multi-destination","quand":"4 à 6 mois avant","note":"Arrivée Osaka Kansai, <b>retour depuis Fukuoka</b>. C'est ce qui rend l'itinéraire cohérent : pas de remontée sur Tokyo.","critique":true},{"quoi":"La sortie à Gunkanjima","quand":"1 mois avant","note":"Deux compagnies, sièges limités. <b>Annulée si la houle dépasse 50 cm</b> — garder le jour 13 en repli.","critique":true},{"quoi":"L'atelier de porcelaine à Arita","quand":"3 semaines avant","note":"La pièce est cuite après votre départ et expédiée : prévoir un mois de délai.","critique":false},{"quoi":"Le shippoku de Nagasaki","quand":"2 semaines avant","note":"Se commande à l'avance et pour trois personnes minimum.","critique":false},{"quoi":"Les hôtels","quand":"2 à 3 mois avant","note":"Kyushu est nettement moins tendu que le Kansai — mais la chambre à trois reste ce qui limite.","critique":false},{"quoi":"L'état du cratère de l'Aso","quand":"le matin même","note":"Le site du parc national publie le niveau de gaz. L'accès ferme sa it déjeuner à Inari","note":"Les échoppes ouvrent avec le premier train. Inari-zushi, thé.","cout":700,"kind":"eat"},{"h":"11h00","quoi":"Kiyomizu-dera et la côte des potiers","note":"Monter par Gojo-zaka plutôt que par Sannenzaka : c'est la rue des ateliers de céramique, et personne ne la prend.","cout":500,"kind":"see"},{"h":"13h00","quoi":"Déjeuner à Nishiki","note":"La halle couverte, quatre cents mètres de comptoirs. On mange debout, on goûte, on ne s'assied pas.","cout":1500,"kind":"eat"},{"h":"15h30","quoi":"Retour à l'hôtel","note":"Sieste assumée. C'est le jour où le décalage frappe le plus fort.","cout":0,"kind":"rest"},{"h":"18h00","quoi":"Gion à la tombée du jour","note":"Hanamikoji et les ruelles de Shirakawa. Regarder les maisons, pas les geiko — les photographier de près est mal vu et désormais interdit dans certaines rues.","cout":0,"kind":"walk"},{"h":"19h30","quoi":"Obanzai","note":"La cuisine domestique de Kyoto, servie en petits plats. Moins cher et plus intéressant qu'un kaiseki de touristes.","cout":3500,"kind":"eat"}],"note":""},{"n":3,"etape":"kyoto","titre":"Nara","blocs":[{"h":"08h15","quoi":"Kintetsu jusqu'à Nara","note":"45 minutes depuis Kyoto, un départ toutes les 30 minutes. La gare Kintetsu est à dix minutes du parc, la gare JR à vingt-cinq.","cout":760,"kind":"move"},{"h":"09h30","quoi":"Todai-ji","note":"Le Bouddha de quinze mètres, sous la plus grande charpente de bois ancienne du monde — et l'actuelle ne fait que les deux tiers de l'originale.","cout":800,"kind":"see"},{"h":"11h00","quoi":"Le parc et les daims","note":"Mille deux cents, en liberté, qui s'inclinent pour un biscuit. Ils mordent aussi les sacs plastique : garder la nourriture hors de vue.","cout":200,"kind":"walk"},{"h":"12h30","quoi":"Déjeuner","note":"Nakatanidou pour le mochi pilé au marteau en public, puis un vrai déjeuner dans Sanjo-dori.","cout":1300,"kind":"eat"},{"h":"14h00","quoi":"Kasuga-taisha","note":"Trois mille lanternes, de pierre le long de l'allée, d
